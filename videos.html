<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video - Facebook</title>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Top Header Navigation Bar */
        .fb-header {
            display: flex;
            align-items: center;
            justify-content: space-around;
            padding: 8px 12px;
            background: #ffffff;
            color: #050505;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .fb-header-item {
            font-size: 20px;
            color: #65676b;
            cursor: pointer;
            position: relative;
            padding: 4px 12px;
        }

        .fb-header-item.active {
            color: #1877f2;
        }

        .fb-header-item.active::after {
            content: '';
            position: absolute;
            bottom: -8px;
            left: 0;
            width: 100%;
            height: 3px;
            background-color: #1877f2;
            border-radius: 2px 2px 0 0;
        }

        .badge-notification {
            position: absolute;
            top: 0;
            right: 4px;
            background-color: #e41e3f;
            color: white;
            font-size: 10px;
            padding: 1px 4px;
            border-radius: 10px;
            font-weight: 700;
        }

        /* Video Reel / Feed Container */
        .video-container {
            position: relative;
            width: 100%;
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #121212;
            overflow: hidden;
        }

        .video-container img.video-bg {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Gradient Overlay for Text Readability */
        .video-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 60%;
            background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0) 100%);
            pointer-events: none;
        }

        /* Right Side Floating Action Buttons */
        .video-actions {
            position: absolute;
            right: 12px;
            bottom: 80px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 18px;
            z-index: 10;
        }

        .action-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
        }

        .action-btn {
            width: 42px;
            height: 42px;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: #ffffff;
            transition: background 0.2s;
        }

        .action-btn:active {
            background: rgba(255, 255, 255, 0.3);
        }

        .action-count {
            font-size: 12px;
            font-weight: 600;
            color: #ffffff;
            text-shadow: 0 1px 2px rgba(0,0,0,0.8);
        }

        /* Bottom Video Info & Caption */
        .video-details {
            position: absolute;
            bottom: 24px;
            left: 12px;
            right: 70px;
            z-index: 10;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .creator-row {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .creator-avatar-wrapper {
            position: relative;
            width: 36px;
            height: 36px;
        }

        .creator-avatar-wrapper img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 1px solid #ffffff;
        }

        .verified-badge {
            position: absolute;
            bottom: -2px;
            right: -2px;
            background: #1877f2;
            color: white;
            font-size: 9px;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid #000;
        }

        .creator-name {
            font-size: 15px;
            font-weight: 700;
            color: #ffffff;
            text-shadow: 0 1px 2px rgba(0,0,0,0.8);
        }

        .follow-btn {
            background: transparent;
            border: 1.5px solid #ffffff;
            color: #ffffff;
            padding: 4px 12px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            margin-left: 6px;
        }

        .follow-btn:active {
            background: rgba(255, 255, 255, 0.2);
        }

        .audio-row {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: #e4e6eb;
            text-shadow: 0 1px 2px rgba(0,0,0,0.8);
        }

        .video-caption {
            font-size: 14px;
            color: #ffffff;
            line-height: 1.3;
            text-shadow: 0 1px 2px rgba(0,0,0,0.8);
            display: -webkit-box;
            -webkit-line-clamp: 1;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .video-caption .see-more {
            color: #b0b3b8;
            font-weight: 600;
            cursor: pointer;
        }

        /* Video Progress Bar / Bottom Indicator */
        .video-progress-bar {
            position: absolute;
            bottom: 4px;
            left: 0;
            width: 100%;
            height: 3px;
            background: rgba(255, 255, 255, 0.3);
            z-index: 15;
        }

        .video-progress-fill {
            width: 45%;
            height: 100%;
            background: #ffffff;
        }

        .home-indicator {
            width: 120px;
            height: 4px;
            background-color: #ffffff;
            border-radius: 2px;
            margin: 6px auto;
            position: relative;
            z-index: 20;
        }
    </style>
</head>
<body>

    <!-- Top Navigation Bar -->
    <div class="fb-header">
        <div class="fb-header-item" onclick="location.href='index.html'"><i class="fa-solid fa-house"></i></div>
        <div class="fb-header-item" onclick="location.href='friend-request.html'"><i class="fa-solid fa-user-group"></i></div>
        <div class="fb-header-item" onclick="location.href='messenger.html'"><i class="fa-brands fa-facebook-messenger"></i></div>
        <div class="fb-header-item active">
            <i class="fa-solid fa-clapperboard"></i>
            <span class="badge-notification">15+</span>
        </div>
        <div class="fb-header-item"><i class="fa-solid fa-bell"></i></div>
        <div class="fb-header-item"><i class="fa-solid fa-bars"></i></div>
    </div>

    <!-- Video Main Container -->
    <div class="video-container">
        <!-- Background image representing the video frame from screenshot -->
        <img src="https://images.unsplash.com/photo-1529699211952-734e80c4d42b?w=800&auto=format&fit=crop&q=80" alt="Video Player" class="video-bg" style="object-fit: cover; width: 100%; height: 100%;">
        
        <!-- Gradient Overlay -->
        <div class="video-overlay"></div>

        <!-- Right Action Buttons -->
        <div class="video-actions">
            <div class="action-item" onclick="let cnt=this.querySelector('.action-count'); cnt.innerText = (parseInt(cnt.innerText)+1)+'K';">
                <div class="action-btn"><i class="fa-solid fa-thumbs-up"></i></div>
                <div class="action-count">1.4K</div>
            </div>
            <div class="action-item" onclick="alert('Opening comments...')">
                <div class="action-btn"><i class="fa-solid fa-comment"></i></div>
                <div class="action-count">27</div>
            </div>
            <div class="action-item" onclick="alert('Share options opened!')">
                <div class="action-btn"><i class="fa-solid fa-share"></i></div>
                <div class="action-count">39</div>
            </div>
            <div class="action-item" onclick="alert('Options menu opened!')">
                <div class="action-btn"><i class="fa-solid fa-ellipsis"></i></div>
            </div>
        </div>

        <!-- Bottom Video Details & Caption -->
        <div class="video-details">
            <div class="creator-row">
                <div class="creator-avatar-wrapper">
                    <img src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=200&auto=format&fit=crop&q=60" alt="Alwan Wijaya">
                    <div class="verified-badge"><i class="fa-solid fa-check" style="font-size: 7px;"></i></div>
                </div>
                <div class="creator-name">Alwan Wijaya</div>
                <button class="follow-btn" onclick="this.innerText = (this.innerText === 'Follow') ? 'Following' : 'Follow';">Follow</button>
            </div>
            <div class="audio-row">
                <i class="fa-solid fa-music" style="font-size: 10px;"></i>
                <span>Tony Dark Eyes · Dali</span>
            </div>
            <div class="video-caption">
                Black is ready to promote and w... <span class="see-more" onclick="alert('Full description: Black is ready to promote and win the match!')">more</span>
            </div>
        </div>

        <!-- Progress Bar -->
        <div class="video-progress-bar">
            <div class="video-progress-fill"></div>
        </div>
    </div>

    <!-- Bottom Home Indicator -->
    <div style="background: #000; width: 100%;">
        <div class="home-indicator"></div>
    </div>

</body>
</html>
