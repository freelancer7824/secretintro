<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Create Post - Facebook</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #f0f2f5;
            color: #050505;
            display: flex;
            justify-content: center;
            overflow-x: hidden;
        }

        .fb-container {
            width: 100%;
            max-width: 500px;
            background-color: #ffffff;
            min-height: 100vh;
            position: relative;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .create-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background: #ffffff;
            border-bottom: 1px solid #ced0d4;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .back-btn {
            background: none;
            border: none;
            font-size: 20px;
            color: #050505;
            cursor: pointer;
            padding: 5px;
            border-radius: 50%;
            transition: background 0.2s;
        }

        .back-btn:hover {
            background: #f0f2f5;
        }

        .header-title {
            font-size: 18px;
            font-weight: 600;
            color: #050505;
        }

        .post-top-btn {
            background: none;
            border: none;
            color: #1877f2;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            padding: 8px 16px;
            border-radius: 20px;
            transition: background 0.2s;
        }

        .post-top-btn:hover:not(:disabled) {
            background: #e7f3ff;
        }

        .post-top-btn:disabled {
            color: #bcc0c4;
            cursor: default;
        }

        .user-info-section {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 16px;
        }

        .user-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #1877f2;
            transition: transform 0.3s ease, border 0.3s ease;
        }

        .user-avatar.updating {
            animation: avatarUpdate 0.4s ease;
        }

        @keyframes avatarUpdate {
            0% { transform: scale(1.1); border: 2px solid #1877f2; }
            100% { transform: scale(1); border: 2px solid #1877f2; }
        }

        .user-details h4 {
            font-size: 15px;
            font-weight: 600;
            color: #050505;
            margin-bottom: 2px;
            transition: color 0.3s ease;
        }

        .user-details h4.name-updated {
            animation: namePulse 0.5s ease;
        }

        @keyframes namePulse {
            0% { color: #1877f2; transform: scale(1.05); }
            100% { color: #050505; transform: scale(1); }
        }

        .privacy-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            background-color: #e4e6eb;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
            color: #050505;
            cursor: pointer;
            transition: background 0.2s;
        }

        .privacy-badge:hover {
            background-color: #d8dadf;
        }

        .post-editor-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            min-height: 180px;
            transition: all 0.3s ease;
            border-radius: 8px;
            position: relative;
        }

        .post-editor-area.theme-white { 
            background: #ffffff; 
            text-align: left; 
            margin: 0 16px;
            padding: 0 16px;
            border-radius: 0;
            min-height: 120px;
        }

        .post-editor-area.theme-purple { 
            background: linear-gradient(135deg, #8A2387, #E94057, #F27121); 
            text-align: center; 
            border-radius: 8px; 
            margin: 10px 16px; 
            padding: 30px 20px;
            min-height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .post-editor-area.theme-red { 
            background: linear-gradient(135deg, #CB356B, #BD3F32); 
            text-align: center; 
            border-radius: 8px; 
            margin: 10px 16px; 
            padding: 30px 20px;
            min-height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .post-editor-area.theme-dark { 
            background: #242526; 
            text-align: center; 
            border-radius: 8px; 
            margin: 10px 16px; 
            padding: 30px 20px;
            min-height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .post-editor-area.theme-sunset { 
            background: linear-gradient(135deg, #ff7e5f, #feb47b); 
            text-align: center; 
            border-radius: 8px; 
            margin: 10px 16px; 
            padding: 30px 20px;
            min-height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .post-editor-area.theme-purple textarea,
        .post-editor-area.theme-red textarea,
        .post-editor-area.theme-dark textarea,
        .post-editor-area.theme-sunset textarea {
            color: #ffffff;
            text-align: center;
            font-size: 22px;
            font-weight: bold;
            min-height: 100px;
            width: 100%;
        }

        .post-editor-area.theme-dark textarea::placeholder {
            color: #b0b3b8;
        }

        .post-editor-area.theme-white textarea {
            color: #050505;
            text-align: left;
            font-size: 18px;
            font-weight: normal;
            min-height: 120px;
        }

        .post-textarea {
            width: 100%;
            border: none;
            outline: none;
            background: transparent;
            resize: none;
            line-height: 1.5;
        }

        .post-textarea::placeholder {
            color: #65676b;
            font-style: italic;
        }

        .theme-purple .post-textarea::placeholder,
        .theme-red .post-textarea::placeholder,
        .theme-dark .post-textarea::placeholder,
        .theme-sunset .post-textarea::placeholder {
            color: rgba(255,255,255,0.7);
        }

        .char-count-container {
            text-align: right;
            padding: 4px 16px 8px 16px;
            font-size: 12px;
            color: #65676b;
        }

        .char-count-container .warning {
            color: #e41e3f;
        }

        .media-preview-container {
            padding: 0 16px 12px 16px;
            position: relative;
        }

        .media-preview-container img, 
        .media-preview-container video {
            width: 100%;
            max-height: 300px;
            object-fit: cover;
            border-radius: 8px;
        }

        .media-preview-container .thumbnail-overlay {
            position: relative;
            display: inline-block;
            width: 100%;
        }

        .media-preview-container .thumbnail-overlay .play-icon {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 48px;
            opacity: 0.9;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
            pointer-events: none;
        }

        .remove-media-btn {
            position: absolute;
            top: 8px;
            right: 24px;
            background: rgba(0,0,0,0.6);
            color: white;
            border: none;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            transition: background 0.2s;
            z-index: 10;
        }

        .remove-media-btn:hover {
            background: rgba(0,0,0,0.8);
        }

        .bg-selector-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 16px;
            overflow-x: auto;
            scrollbar-width: none;
            border-top: 1px solid #f0f2f5;
        }

        .bg-selector-bar::-webkit-scrollbar { display: none; }

        .bg-icon-btn {
            background: none;
            border: none;
            font-size: 18px;
            color: #65676b;
            cursor: pointer;
            padding: 5px;
            border-radius: 50%;
            transition: background 0.2s;
        }

        .bg-icon-btn:hover {
            background: #f0f2f5;
        }

        .color-bubble {
            width: 32px;
            height: 32px;
            border-radius: 6px;
            cursor: pointer;
            border: 2px solid transparent;
            flex-shrink: 0;
            transition: all 0.2s;
        }

        .color-bubble:hover {
            transform: scale(1.1);
        }

        .color-bubble.active {
            border-color: #1877f2;
            box-shadow: 0 0 0 2px #1877f2;
        }

        .options-list {
            padding: 6px 16px;
            border-top: 1px solid #e4e6eb;
        }

        .option-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 4px;
            font-size: 15px;
            font-weight: 600;
            color: #050505;
            cursor: pointer;
            border-bottom: 1px solid #f0f2f5;
            text-decoration: none;
            transition: background 0.2s;
            border-radius: 4px;
        }

        .option-item:hover {
            background: #f0f2f5;
        }

        .option-item:last-child {
            border-bottom: none;
        }

        .option-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .option-left i {
            font-size: 22px;
        }

        .bottom-action-container {
            padding: 12px 16px;
            background: #ffffff;
            border-top: 1px solid #e4e6eb;
            position: sticky;
            bottom: 0;
        }

        .btn-post-full {
            width: 100%;
            height: 48px;
            background-color: #1877f2;
            color: white;
            font-size: 16px;
            font-weight: 600;
            border: none;
            border-radius: 24px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .btn-post-full:active:not(:disabled) {
            transform: scale(0.98);
        }

        .btn-post-full:disabled {
            background-color: #e4e6eb;
            color: #bcc0c4;
            cursor: default;
        }

        .btn-post-full:not(:disabled):hover {
            background-color: #166fe5;
        }

        #mediaFileInput {
            display: none;
        }

        #loadingOverlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            z-index: 999;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 18px;
            font-weight: 600;
            flex-direction: column;
            gap: 15px;
        }

        .loader-spinner {
            width: 50px;
            height: 50px;
            border: 5px solid #f3f3f3;
            border-top: 5px solid #1877f2;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .toast-notification {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: rgba(0, 0, 0, 0.85);
            color: white;
            padding: 12px 24px;
            border-radius: 12px;
            font-size: 14px;
            z-index: 9999;
            opacity: 0;
            transition: all 0.4s ease;
            pointer-events: none;
            max-width: 90%;
            text-align: center;
        }

        .toast-notification.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .toast-notification.success {
            background: rgba(49, 162, 76, 0.95);
        }

        .toast-notification.error {
            background: rgba(228, 30, 63, 0.95);
        }

        .dark-theme .fb-container {
            background-color: #242526;
        }

        .dark-theme .create-header {
            background-color: #242526;
            border-bottom-color: #3e4041;
        }

        .dark-theme .header-title {
            color: #e4e6eb;
        }

        .dark-theme .back-btn {
            color: #e4e6eb;
        }

        .dark-theme .back-btn:hover {
            background: #3a3b3c;
        }

        .dark-theme .user-details h4 {
            color: #e4e6eb;
        }

        .dark-theme .post-editor-area.theme-white {
            background: #3a3b3c;
        }

        .dark-theme .post-editor-area.theme-white textarea {
            color: #e4e6eb;
        }

        .dark-theme .post-editor-area.theme-white textarea::placeholder {
            color: #b0b3b8;
        }

        .dark-theme .bg-selector-bar {
            border-top-color: #3e4041;
        }

        .dark-theme .options-list {
            border-top-color: #3e4041;
        }

        .dark-theme .option-item {
            color: #e4e6eb;
            border-bottom-color: #3e4041;
        }

        .dark-theme .option-item:hover {
            background: #3a3b3c;
        }

        .dark-theme .bottom-action-container {
            background-color: #242526;
            border-top-color: #3e4041;
        }

        .dark-theme .privacy-badge {
            background-color: #3a3b3c;
            color: #e4e6eb;
        }

        .dark-theme .privacy-badge:hover {
            background-color: #4a4b4c;
        }

        .dark-theme .char-count-container {
            color: #b0b3b8;
        }

        .theme-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #e4e6eb;
            border: none;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            font-size: 18px;
            cursor: pointer;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #050505;
            transition: all 0.3s ease;
        }

        .theme-toggle:hover {
            transform: scale(1.05);
            background: #d8dadf;
        }

        .banner-preview-text {
            display: none;
            width: 100%;
            text-align: center;
            font-size: 22px;
            font-weight: bold;
            color: #ffffff;
            padding: 10px 0;
            word-wrap: break-word;
        }

        .theme-purple .banner-preview-text,
        .theme-red .banner-preview-text,
        .theme-dark .banner-preview-text,
        .theme-sunset .banner-preview-text {
            display: block;
        }

        .theme-dark .banner-preview-text {
            color: #ffffff;
        }

        .upload-progress {
            display: none;
            margin: 8px 16px;
            padding: 8px 12px;
            background: #e7f3ff;
            border-radius: 8px;
            font-size: 14px;
            color: #1877f2;
            align-items: center;
            gap: 10px;
        }

        .upload-progress.active {
            display: flex;
        }

        .upload-progress .progress-bar {
            flex: 1;
            height: 4px;
            background: #d0d7de;
            border-radius: 2px;
            overflow: hidden;
        }

        .upload-progress .progress-bar .fill {
            height: 100%;
            background: #1877f2;
            width: 0%;
            transition: width 0.3s;
        }

        .thumbnail-capturing {
            display: none;
            margin: 8px 16px;
            padding: 8px 12px;
            background: #fff3e0;
            border-radius: 8px;
            font-size: 14px;
            color: #e65100;
            align-items: center;
            gap: 10px;
        }

        .thumbnail-capturing.active {
            display: flex;
        }

        .thumbnail-capturing .spinner-small {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid #e65100;
            border-top: 2px solid transparent;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
    </style>
</head>
<body>

    <button class="theme-toggle" onclick="toggleTheme()" id="themeToggle">
        <i class="fa-solid fa-moon"></i>
    </button>

    <div id="loadingOverlay">
        <div class="loader-spinner"></div>
        <span>Publishing your post...</span>
    </div>

    <div class="fb-container">
        <div class="toast-notification" id="toastNotification"></div>

        <div class="create-header">
            <div class="header-left">
                <button class="back-btn" onclick="goBack()"><i class="fa-solid fa-arrow-left"></i></button>
                <span class="header-title">Create post</span>
            </div>
            <button class="post-top-btn" id="topPostBtn" onclick="submitPost()" disabled>POST</button>
        </div>

        <div class="user-info-section">
            <img src="" alt="Profile" class="user-avatar" id="creatorAvatar">
            <div class="user-details">
                <h4 id="creatorName">Loading...</h4>
                <div class="privacy-badge">
                    <i class="fa-solid fa-earth-americas" style="font-size: 11px;"></i> Public <i class="fa-solid fa-caret-down" style="font-size: 10px;"></i>
                </div>
            </div>
        </div>

        <div class="post-editor-area theme-white" id="editorContainer">
            <textarea id="postText" class="post-textarea" placeholder="Share a highlight from your day..." oninput="handleTextInput()"></textarea>
            <div class="banner-preview-text" id="bannerPreviewText"></div>
        </div>

        <div class="char-count-container" id="charCount">
            <span id="charCountText">0 characters</span>
        </div>

        <!-- Thumbnail Capturing Status -->
        <div class="thumbnail-capturing" id="thumbnailCapturing">
            <span class="spinner-small"></span>
            <span id="thumbnailCapturingText">Capturing video thumbnail...</span>
        </div>

        <!-- Upload Progress Bar -->
        <div class="upload-progress" id="uploadProgress">
            <i class="fa-solid fa-spinner fa-spin"></i>
            <span id="uploadProgressText">Uploading...</span>
            <div class="progress-bar">
                <div class="fill" id="progressFill"></div>
            </div>
        </div>

        <div class="media-preview-container" id="mediaPreviewContainer" style="display: none;">
            <div id="mediaPreviewContent"></div>
            <button class="remove-media-btn" onclick="removeMedia()"><i class="fa-solid fa-xmark"></i></button>
        </div>

        <div class="bg-selector-bar">
            <button class="bg-icon-btn"><i class="fa-solid fa-arrow-left"></i></button>
            <div class="color-bubble active" style="background: #ffffff; border: 1px solid #ced0d4;" onclick="setTheme('theme-white', this)"></div>
            <div class="color-bubble" style="background: linear-gradient(135deg, #8A2387, #E94057, #F27121);" onclick="setTheme('theme-purple', this)"></div>
            <div class="color-bubble" style="background: linear-gradient(135deg, #CB356B, #BD3F32);" onclick="setTheme('theme-red', this)"></div>
            <div class="color-bubble" style="background: #242526;" onclick="setTheme('theme-dark', this)"></div>
            <div class="color-bubble" style="background: linear-gradient(135deg, #ff7e5f, #feb47b);" onclick="setTheme('theme-sunset', this)"></div>
            <button class="bg-icon-btn"><i class="fa-solid fa-at"></i></button>
        </div>

        <div class="options-list">
            <!-- Direct file picker trigger -->
            <div class="option-item" id="mediaPickerBtn">
                <div class="option-left">
                    <i class="fa-solid fa-images" style="color: #45bd62;"></i>
                    <span>Photos/Videos</span>
                </div>
                <i class="fa-solid fa-chevron-right" style="font-size: 12px; color: #8c939d;"></i>
            </div>
            <div class="option-item" onclick="showToast('Music feature coming soon', 'info')">
                <div class="option-left">
                    <i class="fa-solid fa-music" style="color: #f76b1c;"></i>
                    <span>Music</span>
                </div>
                <i class="fa-solid fa-chevron-right" style="font-size: 12px; color: #8c939d;"></i>
            </div>
            <div class="option-item" onclick="showToast('Tag people feature coming soon', 'info')">
                <div class="option-left">
                    <i class="fa-solid fa-user-tag" style="color: #1877f2;"></i>
                    <span>Tag people</span>
                </div>
                <i class="fa-solid fa-chevron-right" style="font-size: 12px; color: #8c939d;"></i>
            </div>
            <div class="option-item" onclick="showToast('Add location feature coming soon', 'info')">
                <div class="option-left">
                    <i class="fa-solid fa-location-dot" style="color: #e41e3f;"></i>
                    <span>Add location</span>
                </div>
                <i class="fa-solid fa-chevron-right" style="font-size: 12px; color: #8c939d;"></i>
            </div>
            <div class="option-item" onclick="showToast('Feeling/activity feature coming soon', 'info')">
                <div class="option-left">
                    <i class="fa-solid fa-face-smile" style="color: #f7b125;"></i>
                    <span>Feeling/activity</span>
                </div>
                <i class="fa-solid fa-chevron-right" style="font-size: 12px; color: #8c939d;"></i>
            </div>
        </div>

        <!-- Hidden file input -->
        <input type="file" id="mediaFileInput" accept="image/*,video/*" onchange="handleFileSelect(event)">

        <div class="bottom-action-container">
            <button class="btn-post-full" id="bottomPostBtn" onclick="submitPost()" disabled>POST</button>
        </div>
    </div>

    <script>
        // ============================================================
        // FIREBASE CONFIGURATION
        // ============================================================
        const firebaseConfig = {
            apiKey: "AIzaSyDOJaV7zMLhtA-_z1nkcdbtaa3w7M_0Fh4",
            authDomain: "money-generate-dbab3.firebaseapp.com",
            databaseURL: "https://money-generate-dbab3-default-rtdb.firebaseio.com",
            projectId: "money-generate-dbab3",
            storageBucket: "money-generate-dbab3.firebasestorage.app",
            messagingSenderId: "579756089926",
            appId: "1:579756089926:web:abbe35377e3657889be047"
        };

        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        const auth = firebase.auth();

        // ============================================================
        // CLOUDINARY CONFIG
        // ============================================================
        const CLOUDINARY_CLOUD_NAME = 'dhvtgzy5x';
        const CLOUDINARY_UPLOAD_PRESET = 'Rosenews';
        const CLOUDINARY_UPLOAD_URL = `https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/upload`;

        let currentUser = {
            name: 'User',
            email: '',
            uid: '',
            avatar: ''
        };

        let currentTheme = 'theme-white';
        let selectedMediaData = null; // Cloudinary URL
        let selectedMediaType = 'none';
        let selectedThumbnail = null; // Captured thumbnail URL (data URL)
        let isSubmitting = false;
        let isUploading = false;
        let isCapturingThumbnail = false;
        const MAX_CHARS_BANNER = 100;

        // ============================================================
        // THEME TOGGLE
        // ============================================================
        function toggleTheme() {
            const body = document.body;
            const btn = document.getElementById('themeToggle');
            const isDark = body.classList.toggle('dark-theme');
            btn.innerHTML = isDark ? '<i class="fa-solid fa-sun"></i>' : '<i class="fa-solid fa-moon"></i>';
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
        }

        (function loadTheme() {
            const theme = localStorage.getItem('theme');
            if (theme === 'dark') {
                document.body.classList.add('dark-theme');
                document.getElementById('themeToggle').innerHTML = '<i class="fa-solid fa-sun"></i>';
            }
        })();

        // ============================================================
        // TOAST NOTIFICATION
        // ============================================================
        function showToast(message, type = 'info') {
            const toast = document.getElementById('toastNotification');
            toast.textContent = message;
            toast.className = 'toast-notification ' + type;
            toast.classList.add('show');
            clearTimeout(toast._timeout);
            toast._timeout = setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        // ============================================================
        // GO BACK
        // ============================================================
        function goBack() {
            const lastPage = sessionStorage.getItem('lastPage') || 'index.html';
            window.location.href = lastPage;
        }

        // ============================================================
        // CHECK AUTH
        // ============================================================
        function checkAuth() {
            auth.onAuthStateChanged((user) => {
                if (user) {
                    currentUser.uid = user.uid;
                    currentUser.email = user.email;
                    loadUserData(user);
                } else {
                    window.location.href = 'login.html';
                }
            });
        }

        // ============================================================
        // LOAD USER DATA WITH REALTIME LISTENER (INSTANT UPDATE)
        // ============================================================
        function loadUserData(user) {
            const uid = user.uid;
            
            // Listen for real-time updates to user profile
            database.ref(`users/${uid}`).on('value', (snapshot) => {
                let dataChanged = false;
                let newName = currentUser.name;
                let newAvatar = currentUser.avatar;
                
                if (snapshot.exists()) {
                    const data = snapshot.val();
                    newName = data.name || data.firstName + ' ' + data.lastName || user.displayName || 'User';
                    newAvatar = data.avatar || data.profilePic || user.photoURL || 'https://ui-avatars.com/api/?name=' + encodeURIComponent(newName) + '&background=1877f2&color=fff&size=100';
                    currentUser.email = data.email || user.email;
                } else {
                    newName = user.displayName || 'User';
                    newAvatar = user.photoURL || 'https://ui-avatars.com/api/?name=' + encodeURIComponent(newName) + '&background=1877f2&color=fff&size=100';
                }

                // Check if data actually changed to trigger animation
                if (newName !== currentUser.name) {
                    dataChanged = true;
                }
                if (newAvatar !== currentUser.avatar) {
                    dataChanged = true;
                }

                currentUser.name = newName;
                currentUser.avatar = newAvatar;
                
                updateUI(dataChanged);
            });
        }

        function updateUI(triggerAnimation = false) {
            const nameEl = document.getElementById('creatorName');
            const avatarEl = document.getElementById('creatorAvatar');
            
            const newName = currentUser.name || 'User';
            const newAvatar = currentUser.avatar || 'https://ui-avatars.com/api/?name=' + encodeURIComponent(newName) + '&background=1877f2&color=fff&size=100';

            // Update Name
            if (nameEl.textContent !== newName) {
                nameEl.textContent = newName;
                if (triggerAnimation) {
                    nameEl.classList.remove('name-updated');
                    void nameEl.offsetWidth; // Trigger reflow
                    nameEl.classList.add('name-updated');
                }
            }

            // Update Avatar
            if (avatarEl.src !== newAvatar) {
                avatarEl.src = newAvatar;
                if (triggerAnimation) {
                    avatarEl.classList.remove('updating');
                    void avatarEl.offsetWidth; // Trigger reflow
                    avatarEl.classList.add('updating');
                }
            }
        }

        // ============================================================
        // THEME MANAGEMENT
        // ============================================================
        function setTheme(themeName, element) {
            const editor = document.getElementById('editorContainer');
            const text = document.getElementById('postText').value.trim();
            const charCount = text.length;
            const textarea = document.getElementById('postText');
            const bannerPreview = document.getElementById('bannerPreviewText');

            if (charCount > MAX_CHARS_BANNER && themeName !== 'theme-white') {
                showToast('Text is too long for colored banner. Maximum ' + MAX_CHARS_BANNER + ' characters allowed.', 'error');
                return;
            }

            document.querySelectorAll('.color-bubble').forEach(b => b.classList.remove('active'));
            if (element) element.classList.add('active');

            editor.className = `post-editor-area ${themeName}`;
            currentTheme = themeName;

            if (themeName !== 'theme-white' && text.length > 0) {
                textarea.style.display = 'none';
                bannerPreview.style.display = 'block';
                bannerPreview.textContent = text;
            } else {
                textarea.style.display = 'block';
                bannerPreview.style.display = 'none';
            }

            if (themeName !== 'theme-white') {
                textarea.placeholder = 'Write something...';
            } else {
                textarea.placeholder = 'Share a highlight from your day...';
            }
        }

        // ============================================================
        // TEXT INPUT HANDLER
        // ============================================================
        function handleTextInput() {
            const textarea = document.getElementById('postText');
            const text = textarea.value;
            const charCount = text.length;
            const charCountEl = document.getElementById('charCountText');
            const bannerPreview = document.getElementById('bannerPreviewText');
            
            charCountEl.textContent = charCount + ' characters';
            
            if (charCount > MAX_CHARS_BANNER && currentTheme !== 'theme-white') {
                charCountEl.classList.add('warning');
                charCountEl.textContent = '⚠️ ' + charCount + ' characters (max ' + MAX_CHARS_BANNER + ' for banner)';
            } else {
                charCountEl.classList.remove('warning');
            }

            if (currentTheme !== 'theme-white' && text.length > 0) {
                textarea.style.display = 'none';
                bannerPreview.style.display = 'block';
                bannerPreview.textContent = text;
            } else if (currentTheme !== 'theme-white' && text.length === 0) {
                textarea.style.display = 'block';
                bannerPreview.style.display = 'none';
            } else {
                textarea.style.display = 'block';
                bannerPreview.style.display = 'none';
            }

            if (charCount > MAX_CHARS_BANNER && currentTheme !== 'theme-white') {
                const editor = document.getElementById('editorContainer');
                editor.className = 'post-editor-area theme-white';
                currentTheme = 'theme-white';
                textarea.style.display = 'block';
                bannerPreview.style.display = 'none';
                textarea.placeholder = 'Share a highlight from your day...';
                document.querySelectorAll('.color-bubble').forEach(b => b.classList.remove('active'));
                document.querySelector('.color-bubble:first-child').classList.add('active');
                showToast('Background removed due to long text. Maximum ' + MAX_CHARS_BANNER + ' characters for colored posts.', 'info');
            }

            const topBtn = document.getElementById('topPostBtn');
            const bottomBtn = document.getElementById('bottomPostBtn');
            const hasContent = text.trim().length > 0 || selectedMediaData;

            if (hasContent && !isUploading && !isCapturingThumbnail) {
                topBtn.removeAttribute('disabled');
                bottomBtn.removeAttribute('disabled');
            } else {
                topBtn.setAttribute('disabled', 'true');
                bottomBtn.setAttribute('disabled', 'true');
            }
        }

        // ============================================================
        // CAPTURE VIDEO THUMBNAIL FROM MIDDLE OF VIDEO
        // ============================================================
        function captureVideoThumbnail(videoFile) {
            return new Promise((resolve, reject) => {
                const video = document.createElement('video');
                video.preload = 'metadata';
                video.muted = true;
                video.playsInline = true;
                
                const url = URL.createObjectURL(videoFile);
                video.src = url;

                const thumbnailStatus = document.getElementById('thumbnailCapturing');
                const thumbnailText = document.getElementById('thumbnailCapturingText');
                thumbnailStatus.classList.add('active');
                thumbnailText.textContent = 'Capturing video thumbnail from middle frame...';

                video.addEventListener('loadedmetadata', function onMetadata() {
                    const duration = video.duration;
                    // Seek to 40% of video duration (mid-point)
                    const seekTime = Math.min(duration * 0.4, duration - 0.5);
                    video.currentTime = Math.max(seekTime, 0.1);
                    
                    video.addEventListener('seeked', function onSeeked() {
                        try {
                            const canvas = document.createElement('canvas');
                            const videoWidth = video.videoWidth || 640;
                            const videoHeight = video.videoHeight || 360;
                            canvas.width = videoWidth;
                            canvas.height = videoHeight;
                            const ctx = canvas.getContext('2d');
                            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                            
                            const thumbnailDataUrl = canvas.toDataURL('image/jpeg', 0.85);
                            
                            thumbnailStatus.classList.remove('active');
                            URL.revokeObjectURL(url);
                            
                            resolve(thumbnailDataUrl);
                        } catch (err) {
                            thumbnailStatus.classList.remove('active');
                            reject(err);
                        }
                        
                        video.removeEventListener('seeked', onSeeked);
                    });

                    // Fallback if seeked doesn't fire
                    setTimeout(() => {
                        if (thumbnailStatus.classList.contains('active')) {
                            try {
                                const canvas = document.createElement('canvas');
                                const videoWidth = video.videoWidth || 640;
                                const videoHeight = video.videoHeight || 360;
                                canvas.width = videoWidth;
                                canvas.height = videoHeight;
                                const ctx = canvas.getContext('2d');
                                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                                const thumbnailDataUrl = canvas.toDataURL('image/jpeg', 0.85);
                                thumbnailStatus.classList.remove('active');
                                URL.revokeObjectURL(url);
                                resolve(thumbnailDataUrl);
                            } catch (err) {
                                thumbnailStatus.classList.remove('active');
                                reject(err);
                            }
                        }
                    }, 3000);
                });

                video.addEventListener('error', function() {
                    thumbnailStatus.classList.remove('active');
                    URL.revokeObjectURL(url);
                    reject(new Error('Failed to load video for thumbnail capture'));
                });

                // If video already loaded enough
                if (video.readyState >= 2) {
                    video.dispatchEvent(new Event('loadedmetadata'));
                }
            });
        }

        // ============================================================
        // DIRECT FILE PICKER + CLOUDINARY UPLOAD
        // ============================================================
        document.getElementById('mediaPickerBtn').addEventListener('click', function() {
            document.getElementById('mediaFileInput').click();
        });

        async function handleFileSelect(event) {
            const file = event.target.files[0];
            if (!file) return;

            // Validate file size (50MB max)
            if (file.size > 50 * 1024 * 1024) {
                showToast('File size too large! Maximum 50MB allowed.', 'error');
                event.target.value = '';
                return;
            }

            // Validate file type
            const isImage = file.type.startsWith('image/');
            const isVideo = file.type.startsWith('video/');
            if (!isImage && !isVideo) {
                showToast('Please select an image or video file.', 'error');
                event.target.value = '';
                return;
            }

            // For videos, capture thumbnail from middle
            let thumbnailDataUrl = null;
            if (isVideo) {
                isCapturingThumbnail = true;
                const topBtn = document.getElementById('topPostBtn');
                const bottomBtn = document.getElementById('bottomPostBtn');
                topBtn.setAttribute('disabled', 'true');
                bottomBtn.setAttribute('disabled', 'true');

                try {
                    thumbnailDataUrl = await captureVideoThumbnail(file);
                    selectedThumbnail = thumbnailDataUrl;
                    showToast('Video thumbnail captured from middle frame!', 'success');
                } catch (err) {
                    console.warn('Thumbnail capture failed:', err);
                    showToast('Could not capture thumbnail. Will use default.', 'info');
                    selectedThumbnail = null;
                }
                isCapturingThumbnail = false;
                handleTextInput();
            } else {
                // For images, use the image itself as thumbnail
                const reader = new FileReader();
                thumbnailDataUrl = await new Promise((resolve) => {
                    reader.onload = (e) => resolve(e.target.result);
                    reader.readAsDataURL(file);
                });
                selectedThumbnail = thumbnailDataUrl;
            }

            // Show progress bar
            const progressEl = document.getElementById('uploadProgress');
            const progressFill = document.getElementById('progressFill');
            const progressText = document.getElementById('uploadProgressText');
            progressEl.classList.add('active');
            progressFill.style.width = '0%';
            progressText.textContent = 'Uploading to Cloudinary...';

            try {
                const formData = new FormData();
                formData.append('file', file);
                formData.append('upload_preset', CLOUDINARY_UPLOAD_PRESET);
                
                const resourceType = isVideo ? 'video' : 'image';
                formData.append('resource_type', resourceType);

                const uploadResult = await new Promise((resolve, reject) => {
                    const xhr = new XMLHttpRequest();
                    xhr.open('POST', CLOUDINARY_UPLOAD_URL, true);

                    xhr.upload.addEventListener('progress', (e) => {
                        if (e.lengthComputable) {
                            const percent = Math.round((e.loaded / e.total) * 100);
                            progressFill.style.width = percent + '%';
                            progressText.textContent = `Uploading... ${percent}%`;
                        }
                    });

                    xhr.onload = function() {
                        if (xhr.status === 200) {
                            try {
                                const response = JSON.parse(xhr.responseText);
                                resolve(response);
                            } catch (err) {
                                reject(new Error('Invalid response from Cloudinary'));
                            }
                        } else {
                            let errorMsg = 'Upload failed';
                            try {
                                const errResp = JSON.parse(xhr.responseText);
                                errorMsg = errResp.error?.message || errorMsg;
                            } catch (e) {}
                            reject(new Error(errorMsg));
                        }
                    };

                    xhr.onerror = function() {
                        reject(new Error('Network error during upload'));
                    };

                    xhr.send(formData);
                });

                progressEl.classList.remove('active');

                const url = uploadResult.secure_url || uploadResult.url;
                const resourceTypeResult = uploadResult.resource_type || resourceType;

                selectedMediaData = url;
                selectedMediaType = resourceTypeResult;

                // Display media preview with thumbnail
                displayMedia(url, resourceTypeResult, thumbnailDataUrl);

                // Auto-switch to white theme
                if (currentTheme !== 'theme-white') {
                    setTheme('theme-white', document.querySelector('.color-bubble:first-child'));
                }
                
                handleTextInput();
                showToast('Media uploaded successfully!', 'success');

            } catch (error) {
                progressEl.classList.remove('active');
                console.error('Upload error:', error);
                showToast('Upload failed: ' + error.message, 'error');
                selectedThumbnail = null;
            }

            event.target.value = '';
        }

        function displayMedia(url, type, thumbnailDataUrl) {
            const previewContainer = document.getElementById('mediaPreviewContainer');
            const previewContent = document.getElementById('mediaPreviewContent');

            if (type === 'video') {
                // Use captured thumbnail if available
                const thumbSrc = thumbnailDataUrl || url.replace('/upload/', '/upload/so_0,du_1/') + '.jpg';
                previewContent.innerHTML = `
                    <div class="thumbnail-overlay">
                        <img src="${thumbSrc}" alt="Video thumbnail" style="max-height:300px;width:100%;border-radius:8px;">
                        <div class="play-icon"><i class="fa-solid fa-play-circle"></i></div>
                    </div>
                    <video style="display:none;max-height:300px;width:100%;border-radius:8px;" controls>
                        <source src="${url}" type="video/mp4">
                        Your browser does not support the video tag.
                    </video>
                `;
                
                // Click to toggle video play
                const overlay = previewContent.querySelector('.thumbnail-overlay');
                const video = previewContent.querySelector('video');
                if (overlay && video) {
                    overlay.addEventListener('click', function() {
                        overlay.style.display = 'none';
                        video.style.display = 'block';
                        video.play().catch(() => {});
                    });
                    video.addEventListener('pause', function() {
                        // Optional: show overlay again when paused
                    });
                    video.addEventListener('ended', function() {
                        video.style.display = 'none';
                        overlay.style.display = 'block';
                    });
                }
            } else {
                previewContent.innerHTML = `<img src="${url}" alt="Uploaded Media" style="max-height:300px;width:100%;border-radius:8px;">`;
            }

            previewContainer.style.display = 'block';
        }

        function removeMedia() {
            selectedMediaData = null;
            selectedMediaType = 'none';
            selectedThumbnail = null;
            document.getElementById('mediaPreviewContainer').style.display = 'none';
            document.getElementById('mediaPreviewContent').innerHTML = '';
            handleTextInput();
        }

        // ============================================================
        // SUBMIT POST
        // ============================================================
        async function submitPost() {
            if (isSubmitting || isUploading || isCapturingThumbnail) return;
            
            const caption = document.getElementById('postText').value.trim();
            const bannerText = document.getElementById('bannerPreviewText').textContent.trim();
            const finalCaption = currentTheme !== 'theme-white' ? bannerText : caption;
            
            if (!finalCaption && !selectedMediaData) {
                showToast('Please write something or add media', 'error');
                return;
            }

            if (finalCaption.length > MAX_CHARS_BANNER && currentTheme !== 'theme-white') {
                showToast('Text too long for colored banner. Maximum ' + MAX_CHARS_BANNER + ' characters allowed.', 'error');
                return;
            }

            isSubmitting = true;
            const loadingOverlay = document.getElementById('loadingOverlay');
            loadingOverlay.style.display = 'flex';

            try {
                const postData = {
                    name: currentUser.name || 'User',
                    userId: currentUser.uid || 'unknown',
                    avatar: currentUser.avatar || 'https://ui-avatars.com/api/?name=' + encodeURIComponent(currentUser.name) + '&background=1877f2&color=fff&size=100',
                    time: 'Just now',
                    caption: finalCaption,
                    contentType: selectedMediaType === 'none' ? 'text' : selectedMediaType,
                    media: selectedMediaData || '',
                    thumbnail: selectedThumbnail || '',
                    likesCount: 0,
                    likesEmoji: '👍',
                    comments: 0,
                    shares: 0,
                    likedBy: {},
                    theme: currentTheme,
                    timestamp: Date.now()
                };

                await database.ref('feedItems').push(postData);

                loadingOverlay.style.display = 'none';
                showToast('✅ Post published successfully!', 'success');
                isSubmitting = false;

                setTimeout(() => {
                    window.location.href = 'homepage.html';
                }, 1000);

            } catch (error) {
                console.error('Error publishing post:', error);
                loadingOverlay.style.display = 'none';
                showToast('❌ Error publishing post: ' + error.message, 'error');
                isSubmitting = false;
            }
        }

        // ============================================================
        // INIT
        // ============================================================
        window.addEventListener('DOMContentLoaded', function() {
            checkAuth();
        });
    </script>
</body>
