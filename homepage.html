        function showCommentMenu(commentId, postId, source) {
            const menu = document.createElement('div');
            menu.className = 'comment-menu active';
            menu.innerHTML = `
                <div class="menu-item" data-action="edit">Edit</div>
                <div class="menu-item danger" data-action="delete">Delete</div>
            `;
            
            let commentItem;
            if (source === 'detail') {
                commentItem = document.querySelector(`#detailCommentsList .comment-item[data-comment-id="${commentId}"]`);
            } else {
                commentItem = document.querySelector(`.comment-item[data-comment-id="${commentId}"]`);
            }
            
            if (commentItem) {
                commentItem.style.position = 'relative';
                commentItem.appendChild(menu);
                
                menu.querySelectorAll('.menu-item').forEach(item => {
                    item.addEventListener('click', (e) => {
                        e.stopPropagation();
                        const action = item.dataset.action;
                        if (action === 'edit') {
                            editComment(commentId, postId, source);
                        } else if (action === 'delete') {
                            deleteComment(commentId, postId, source);
                        }
                        menu.remove();
                    });
                });
                
                setTimeout(() => {
                    document.addEventListener('click', function closeMenu(e) {
                        if (!menu.contains(e.target) && !e.target.closest('.comment-menu-trigger')) {
                            menu.remove();
                            document.removeEventListener('click', closeMenu);
                        }
                    });
                }, 10);
            }
        }

        function editComment(commentId, postId, source) {
            const post = allPosts.find(p => p.id === postId);
            if (!post) return;
            
            const comment = post.commentsList?.find(c => c.id === commentId);
            if (!comment) return;
            
            const newText = prompt('Edit your comment:', comment.text);
            if (newText && newText.trim() !== '') {
                comment.text = newText.trim();
                comment.timestamp = Date.now();
                savePostToCache(post);
                database.ref(`feedItems/${postId}/commentsList`).set(post.commentsList).catch(() => {});
                
                if (source === 'detail') {
                    renderDetailComments();
                } else {
                    renderComments(post);
                }
                updatePostCommentCount(postId);
            }
        }

        function deleteComment(commentId, postId, source) {
            if (!confirm('Are you sure you want to delete this comment?')) return;
            
            const post = allPosts.find(p => p.id === postId);
            if (!post) return;
            
            post.commentsList = post.commentsList?.filter(c => c.id !== commentId) || [];
            post.comments = post.commentsList?.length || 0;
            savePostToCache(post);
            database.ref(`feedItems/${postId}/commentsList`).set(post.commentsList).catch(() => {});
            database.ref(`feedItems/${postId}/comments`).set(post.comments).catch(() => {});
            
            if (source === 'detail') {
                renderDetailComments();
            } else {
                renderComments(post);
            }
            updatePostCommentCount(postId);
        }

        function addComment() {
            const text = commentInput.value.trim();
            if (!text || !commentTargetPostId) return;

            const post = allPosts.find(p => p.id === commentTargetPostId);
            if (!post) return;

            const comment = {
                id: 'c_' + Date.now(),
                author: currentUser.name || 'User',
                authorId: currentUser.uid || 'guest',
                text: text,
                timestamp: Date.now()
            };

            if (commentTargetReplyTo) {
                if (!post.commentsList) post.commentsList = [];
                const parent = post.commentsList.find(c => c.id === commentTargetReplyTo);
                if (parent) {
                    if (!parent.replies) parent.replies = [];
                    parent.replies.push(comment);
                }
                commentTargetReplyTo = null;
                commentTargetReplyName = null;
                replyIndicator.classList.remove('active');
                commentInput.placeholder = 'Write a comment...';
            } else {
                if (!post.commentsList) post.commentsList = [];
                post.commentsList.push(comment);
            }

            post.comments = (post.comments || 0) + 1;

            database.ref(`feedItems/${post.id}/commentsList`).set(post.commentsList).catch(() => {});
            database.ref(`feedItems/${post.id}/comments`).set(post.comments).catch(() => {});

            commentInput.value = '';
            renderComments(post);
            updatePostCommentCount(post.id);
        }

                            ${c.replies ? c.replies.map(r => {
                                const replyName = userCache[r.authorId]?.name || r.author || 'User';
                                const replyAvatar = userCache[r.authorId]?.avatar || 'https://ui-avatars.com/api/?name=' + encodeURIComponent(replyName) + '&background=1877f2&color=fff&size=20';
                                return `
                                    <div style="margin-left:36px;margin-top:6px;padding-left:8px;border-left:2px solid #e4e6eb;">
                                        <div style="display:flex;gap:8px;margin-top:4px;">
                                            <img src="${replyAvatar}" style="width:20px;height:20px;border-radius:50%;object-fit:cover;cursor:pointer;" data-user-name="${replyName}" data-user-id="${r.authorId || 'unknown'}">
                                            <div style="background:#e4e6eb;padding:4px 10px;border-radius:12px;flex:1;">
                                                <div style="font-weight:600;font-size:12px;cursor:pointer;" data-user-name="${replyName}" data-user-id="${r.authorId || 'unknown'}">${replyName}</div>
                                                <div style="font-size:13px;">${r.text}</div>
                                                <div style="font-size:10px;color:#65676b;margin-top:2px;">${formatTime(r.timestamp)}</div>
                                            </div>
                                        </div>
                                    </div>
                                `;
                            }).join('') : ''}
                        </div>
                    `;
                    list.appendChild(div);

                    if (isOwn) {
                        const menuTrigger = div.querySelector('.detail-comment-menu-trigger');
                        if (menuTrigger) {
                            menuTrigger.addEventListener('click', (e) => {
                                e.stopPropagation();
                                showCommentMenu(c.id, post.id, 'detail');
                            });
                        }
                    }
                });

                list.querySelectorAll('.detail-reply-trigger').forEach(el => {
                    el.addEventListener('click', () => {
                        const commentId = el.dataset.commentId;
                        const author = el.dataset.author;
                        detailCommentTargetReplyTo = commentId;
                        detailCommentTargetReplyName = author;
                        detailReplyIndicator.classList.add('active');
                        detailReplyToName.textContent = 'Replying to ' + author;
                        detailCommentInput.placeholder = '';
                        detailCommentInput.focus();
                    });
                });

                list.querySelectorAll('[data-user-name]').forEach(el => {
                    el.addEventListener('click', (e) => {
                        e.stopPropagation();
                        const userId = el.dataset.userId || 'unknown';
                        const userName = el.dataset.userName || 'User';
                        const userAvatarUrl = userCache[userId]?.avatar || 'https://ui-avatars.com/api/?name=' + encodeURIComponent(userName) + '&background=1877f2&color=fff&size=200';
                        openProfile(userId, userName, userAvatarUrl);
                    });
                });
            };

            const commentsContainer = document.createElement('div');
            commentsContainer.id = 'detailCommentsList';
            commentsContainer.style.padding = '12px 16px';
            detailContent.appendChild(commentsContainer);
            renderDetailComments();

            // Setup detail comment input
            detailCommentTargetReplyTo = null;
            detailCommentTargetReplyName = null;
            detailReplyIndicator.classList.remove('active');
            detailCommentInput.placeholder = 'Write a comment...';

            detailCancelReply.addEventListener('click', () => {
                detailCommentTargetReplyTo = null;
                detailCommentTargetReplyName = null;
                detailReplyIndicator.classList.remove('active');
                detailCommentInput.placeholder = 'Write a comment...';
            });

            function addDetailComment() {
                const text = detailCommentInput.value.trim();
                if (!text || !post) return;
                const comment = {
                    id: 'c_' + Date.now(),
                    author: currentUser.name || 'User',
                    authorId: currentUser.uid || 'guest',
                    text: text,
                    timestamp: Date.now()
                };
                
                if (detailCommentTargetReplyTo) {
                    if (!post.commentsList) post.commentsList = [];
                    const parent = post.commentsList.find(c => c.id === detailCommentTargetReplyTo);
                    if (parent) {
                        if (!parent.replies) parent.replies = [];
                        parent.replies.push(comment);
                    }
                    detailCommentTargetReplyTo = null;
                    detailCommentTargetReplyName = null;
                    detailReplyIndicator.classList.remove('active');
                    detailCommentInput.placeholder = 'Write a comment...';
                } else {
                    if (!post.commentsList) post.commentsList = [];
                    post.commentsList.push(comment);
                }
                
                post.comments = (post.comments || 0) + 1;
                database.ref(`feedItems/${post.id}/commentsList`).set(post.commentsList).catch(() => {});
                database.ref(`feedItems/${post.id}/comments`).set(post.comments).catch(() => {});
                detailCommentInput.value = '';
                renderDetailComments();
                updatePostCommentCount(post.id);
            }

            detailSendComment.addEventListener('click', addDetailComment);
            detailCommentInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') addDetailComment();
            });

            postDetailOverlay.classList.add('active');
            document.body.style.overflow = 'hidden';
            history.pushState({ detail: true, postId: postId }, '');
        }

        function closeDetailOverlay() {
            postDetailOverlay.classList.remove('active');
            document.body.style.overflow = '';
            detailPostId = null;
            
            setTimeout(() => {
                document.querySelectorAll('#feedScroll .post-media-container video').forEach(v => {
                    const rect = v.getBoundingClientRect();
                    if (rect.top < window.innerHeight && rect.bottom > 0) {
                        v.play().catch(() => {});
                    }
                });
            }, 300);
            
            if (history.state?.detail) {
                history.back();
            }
        }

        closeDetail.addEventListener('click', closeDetailOverlay);

        // ============================================================
        // PROFILE OVERLAY
        // ============================================================
        function openProfile(userId, userName, userAvatarUrl) {
            document.querySelectorAll('video').forEach(v => v.pause());
            profileIframe.src = `profile.html?uid=${encodeURIComponent(userId)}`;
            profileOverlay.classList.add('active');
            document.body.style.overflow = 'hidden';
            history.pushState({ profile: true }, '');
        }

        closeProfile.addEventListener('click', () => {
            profileOverlay.classList.remove('active');
            document.body.style.overflow = '';
            profileIframe.src = 'about:blank';
            if (history.state?.profile) {
                history.back();
            }
        });

        userStatusBar.addEventListener('click', (e) => {
            if (e.target.closest('.photo-shortcut') || e.target.closest('.status-input-box')) return;
            openProfile(currentUser.uid || 'me', currentUser.name, currentUser.avatar);
        });

        // ============================================================
        // HANDLE BACK NAVIGATION
        // ============================================================
        window.addEventListener('popstate', (e) => {
            if (storyFullscreen.classList.contains('active')) {
                closeStory();
            } else if (imageViewer.classList.contains('active')) {
                closeImageViewerFn();
            } else if (postDetailOverlay.classList.contains('active')) {
                closeDetailOverlay();
            } else if (profileOverlay.classList.contains('active')) {
                profileOverlay.classList.remove('active');
                document.body.style.overflow = '';
                profileIframe.src = 'about:blank';
            } else if (commentSheet.classList.contains('active')) {
                commentSheet.classList.remove('active');
                commentBackdrop.classList.remove('active');
                document.body.style.overflow = '';
            }
        });

        // ============================================================
        // TOAST NOTIFICATION
        // ============================================================
        function showToast(message) {
            const toast = document.createElement('div');
            toast.style.cssText = `
                position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%);
                background: rgba(0,0,0,0.85); color: white; padding: 12px 24px;
                border-radius: 12px; font-size: 14px; z-index: 9999;
                animation: fadeIn 0.3s ease; max-width: 90%; text-align: center;
            `;
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transition = 'opacity 0.3s';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        // ============================================================
        // INIT
        // ============================================================
        window.addEventListener('DOMContentLoaded', () => {
            checkAuth();
            initScroll();
            initPullToRefresh();

            statusInput.addEventListener('click', () => {
                window.location.href = 'create-post.html';
            });
            photoShortcut.addEventListener('click', () => {
                window.location.href = 'create-post.html';
            });
            document.getElementById('createStory').addEventListener('click', () => {
                window.location.href = 'create-post.html';
            });

            window.addEventListener('online', () => {
                isOffline = false;
                offlineBanner.classList.remove('active');
                refreshFeed(() => {});
                loadStoriesFromFirebase();
            });
            window.addEventListener('offline', () => {
                isOffline = true;
                offlineBanner.classList.add('active');
            });

            document.addEventListener('play', (e) => {
                if (e.target.tagName === 'VIDEO') {
                    const videos = document.querySelectorAll('video');
                    videos.forEach(v => {
                        if (v !== e.target && !v.paused) {
                            v.pause();
                        }
                    });
                    currentlyPlayingVideo = e.target;
                }
            }, true);

            console.log('🔥 Facebook Feed: Real-time user name and profile image updates enabled.');
            console.log('✅ When user changes name/avatar, ALL posts update instantly with animations.');
            console.log('✅ Video stories show thumbnail only, video loads on open with sound ON.');
        });
    </script>
</body>
</html>
