            if (commentInput) {
                const newCommentInput = commentInput.cloneNode(true);
                commentInput.parentNode.replaceChild(newCommentInput, commentInput);
                newCommentInput.addEventListener('keydown', function(e) {
                    if (e.key === 'Enter') { e.preventDefault();
                        sendComment(postId); }
                });
            }
        }

        async function handleLikePost(postId, btnElement) {
            btnElement.style.pointerEvents = 'none';
            const postDiv = btnElement.closest('.feed-post');
            const likeCountSpan = postDiv.querySelector('.like-count');
            let currentLikes = parseInt(likeCountSpan.textContent) || 0;
            const userId = auth.currentUser?.uid;
            if (!userId) { showToast('Please login to like');
                btnElement.style.pointerEvents = 'auto'; return; }
            try {
                const doc = await db.collection('all-user-post').doc(postId).get();
                if (doc.exists) {
                    const data = doc.data();
                    const likedBy = data.likedBy || [];
                    if (likedBy.includes(userId)) {
                        const newLikedBy = likedBy.filter(id => id !== userId);
                        await db.collection('all-user-post').doc(postId).update({ likes: currentLikes - 1, likedBy: newLikedBy });
                        btnElement.classList.remove('liked');
                        btnElement.innerHTML = '<i class="fa-regular fa-thumbs-up"></i> Like';
                        likeCountSpan.textContent = currentLikes - 1;
                        showToast('Post unliked');
                    } else {
                        const newLikedBy = [...likedBy, userId];
                        await db.collection('all-user-post').doc(postId).update({ likes: currentLikes + 1, likedBy: newLikedBy });
                        btnElement.classList.add('liked');
                        btnElement.innerHTML = '<i class="fa-solid fa-thumbs-up"></i> Liked';
                        likeCountSpan.textContent = currentLikes + 1;
                        showToast('Post liked!');
                    }
                }
            } catch (error) { console.error('Error handling like:', error);
                showToast('Error: ' + error.message); }
            btnElement.style.pointerEvents = 'auto';
        }

        async function sendComment(postId) {
            const input = document.getElementById('detail-comment-input');
            const text = input.value.trim();
            if (!text) { showToast('Please write a comment'); return; }
            const user = auth.currentUser;
            if (!user) { showToast('Please login to comment'); return; }
            const userName = user.displayName || user.email?.split('@')[0] || 'User';
            const userImage = user.photoURL ||
                'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=100&q=80';
            const isReply = text.startsWith('@');
            let replyToUser = '';
            let commentText = text;
            if (isReply) {
                const parts = text.split(' ');
                replyToUser = parts[0].substring(1);
                commentText = parts.slice(1).join(' ') || text;
            }
            try {
                const docRef = db.collection('all-user-post').doc(postId);
                const doc = await docRef.get();
                if (!doc.exists) { showToast('Post not found'); return; }
                const data = doc.data();
                let comments = data.comments || [];
                const newComment = {
                    id: Date.now().toString(),
                    userName: userName,
                    userImage: userImage,
                    text: isReply ? commentText : text,
                    timestamp: new Date().toISOString(),
                    replies: [],
                    liked: false,
                    userId: user.uid
                };
                if (isReply) {
                    let found = false;
                    const updatedComments = comments.map(c => {
                        if (c.userName === replyToUser && !found) {
                            found = true;
                            if (!c.replies) c.replies = [];
                            c.replies.push({
                                id: Date.now().toString(),
                                userName: userName,
                                userImage: userImage,
                                text: commentText,
                                timestamp: new Date().toISOString(),
                                liked: false,
                                userId: user.uid
                            });
                        }
                        return c;
                    });
                    if (!found) updatedComments.push(newComment);
                    await docRef.update({ comments: updatedComments });
                } else {
                    comments.push(newComment);
                    await docRef.update({ comments: comments });
                }
                showToast('Comment added!');
                input.value = '';
                setTimeout(() => { loadPostDetail(postId); }, 300);
            } catch (error) { console.error('Error adding comment:', error);
                showToast('Error: ' + error.message); }
        }

        function escapeHTML(str) {
            if (!str) return '';
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        function toggleReadMore(postId, fullText, event) {
            event.stopPropagation();
            const captionSpan = document.getElementById(`caption-${postId}`);
            if (!captionSpan) return;
            if (captionSpan.classList.contains('truncated')) {
                captionSpan.textContent = fullText;
                captionSpan.classList.remove('truncated');
                const btn = captionSpan.parentElement.querySelector('.read-more-btn');
                if (btn) btn.textContent = 'show less';
            } else {
                captionSpan.textContent = fullText.substring(0, 150) + '...';
                captionSpan.classList.add('truncated');
                const btn = captionSpan.parentElement.querySelector('.read-more-btn');
                if (btn) btn.textContent = 'read more';
            }
        }

        // ========== INFINITE SCROLL ==========
        let lastDoc = null;
        let isLoading = false;
        let hasMore = true;
        let postsLoaded = 0;
        const POSTS_PER_PAGE = 10;

        function shuffleArray(arr) {
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        // ========== LOAD POSTS ==========
        async function loadPosts(loadMore = false) {
            if (isLoading || (!loadMore && postsLoaded > 0)) return;
            if (!loadMore) {
                postsLoaded = 0;
                lastDoc = null;
                hasMore = true;
                endOfFeed.style.display = 'none';
                const existingPosts = feedContainer.querySelectorAll('.feed-post');
                existingPosts.forEach(el => el.remove());
                feedLoading.style.display = 'block';
                feedLoading.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Loading posts...';
            } else {
                scrollLoader.style.display = 'block';
            }
            if (!hasMore) { scrollLoader.style.display = 'none';
                endOfFeed.style.display = 'block'; return; }
            isLoading = true;
            try {
                let query = db.collection('all-user-post')
                    .orderBy('timestamp', 'desc')
                    .limit(POSTS_PER_PAGE);
                if (lastDoc) query = query.startAfter(lastDoc);
                const snapshot = await query.get();
                if (snapshot.empty) {
                    hasMore = false;
                    scrollLoader.style.display = 'none';
                    if (postsLoaded === 0) feedLoading.innerHTML = 'No posts yet. Be the first to share!';
                    else endOfFeed.style.display = 'block';
                    isLoading = false;
                    return;
                }
                const posts = [];
                snapshot.forEach(doc => { const data = doc.data();
                    posts.push({ id: doc.id, ...data }); });
                const shuffledPosts = shuffleArray(posts);
                lastDoc = snapshot.docs[snapshot.docs.length - 1];
                postsLoaded += shuffledPosts.length;
                feedLoading.style.display = 'none';
                scrollLoader.style.display = 'none';
                shuffledPosts.forEach((post) => {
                    const postEl = createPostElement(post);
                    feedContainer.insertBefore(postEl, scrollLoader);
                });
                attachFeedListeners();
                // Attach real-time status updates for each post's user
                shuffledPosts.forEach(post => {
                    if (post.userId) {
                        db.collection('users').doc(post.userId).onSnapshot((doc) => {
                            if (doc.exists) {
                                const data = doc.data();
                                const postDiv = document.querySelector(`.feed-post[data-userid="${post.userId}"]`);
                                if (postDiv) {
                                    const statusEl = postDiv.querySelector('.online-status');
                                    if (statusEl) {
                                        statusEl.className = 'online-status ' + (data.status === 'online' ? 'active' :
                                            'inactive');
                                    }
                                    // Update name and photo
                                    const nameEl = postDiv.querySelector('.post-meta h4');
                                    const imgEl = postDiv.querySelector('.post-user-info img');
                                    if (nameEl && data.fullName) nameEl.textContent = data.fullName;
                                    if (imgEl && data.photoURL) imgEl.src = data.photoURL;
                                }
                            }
                        });
                    }
                });
                hasMore = shuffledPosts.length >= POSTS_PER_PAGE;
                if (!hasMore) endOfFeed.style.display = 'block';
                isLoading = false;
            } catch (error) {
                console.error('Error loading posts:', error);
                feedLoading.innerHTML = '⚠️ Failed to load posts. Please refresh.';
                scrollLoader.style.display = 'none';
                isLoading = false;
                showToast('Error loading posts: ' + error.message);
            }
        }

        function attachFeedListeners() {
            document.querySelectorAll('#feed-container .like-btn').forEach(btn => {
                const newBtn = btn.cloneNode(true);
                btn.parentNode.replaceChild(newBtn, btn);
                newBtn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    const postDiv = this.closest('.feed-post');
                    const postId = postDiv.dataset.postId;
                    handleLikePost(postId, this);
                });
            });
            document.querySelectorAll('#feed-container .comment-toggle-btn').forEach(btn => {
                const newBtn = btn.cloneNode(true);
                btn.parentNode.replaceChild(newBtn, btn);
                newBtn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    const postDiv = this.closest('.feed-post');
                    const postId = postDiv.dataset.postId;
                    openPostDetail(postId);
                });
            });
        }

        let observer = null;

        function setupInfiniteScroll() {
            if (observer) observer.disconnect();
            observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting && !isLoading && hasMore) loadPosts(true);
                });
            }, { root: null, rootMargin: '100px', threshold: 0.1 });
            observer.observe(scrollLoader);
        }

        // ========== CREATE POST ELEMENT ==========
        function createPostElement(post) {
            const div = document.createElement('div');
            div.className = 'feed-post';
            div.dataset.postId = post.id;
            div.dataset.userId = post.userId || '';

            // Click on post body opens detail, but NOT on action buttons
            div.addEventListener('click', function(e) {
                // Don't open detail if clicking on action buttons, read more, profile, etc.
                if (e.target.closest('.action-btn') || e.target.closest('.read-more-btn') ||
                    e.target.closest('.comment-box-input') || e.target.closest('.post-options') ||
                    e.target.closest('.profile-container') || e.target.closest('.post-meta h4') ||
                    e.target.closest('.comment-item') || e.target.closest('.comment-count') ||
                    e.target.closest('.post-image-content') || e.target.closest('.like-btn') ||
                    e.target.closest('.comment-toggle-btn')) {
                    return;
                }
                openPostDetail(post.id);
            });

            const currentUser = auth.currentUser;
            let userName = post.userName || 'Unknown User';
            let userImage = post.userImage ||
                'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=100&q=80';
            let userId = post.userId || '';
            if (currentUser && post.userId === currentUser.uid) {
                if (currentUser.displayName) userName = currentUser.displayName;
                if (currentUser.photoURL) userImage = currentUser.photoURL;
            }

            const caption = post.caption || '';
            const fullText = post.fullText || caption;
            const imageUrl = post.imageUrl || '';
            const timestamp = post.timestamp ? new Date(post.timestamp.toDate()).toLocaleString() : 'Just now';
            const likes = post.likes || 0;
            const comments = post.comments || [];
            const isBanner = post.isBanner || false;
            const bannerTheme = post.bannerTheme || 'white';
            const themeStyle = getThemeStyles(bannerTheme);
            const needsReadMore = fullText.length > 150;

            let captionHTML = '';
            if (caption) {
                if (isBanner) {
                    captionHTML = `
                        <div class="banner-content" style="background: ${themeStyle.background}; color: ${themeStyle.color};">
                            <div class="post-caption caption-text">${escapeHTML(caption)}</div>
                        </div>
                    `;
                } else {
                    const displayText = needsReadMore ? fullText.substring(0, 150) + '...' : fullText;
                    captionHTML = `
                        <div class="post-caption">
                            <span class="caption-text ${needsReadMore ? 'truncated' : ''}" id="caption-${post.id}">${escapeHTML(displayText)}</span>
                            ${needsReadMore ? `<span class="read-more-btn" onclick="toggleReadMore('${post.id}', '${escapeHTML(fullText)}', event)">read more</span>` : ''}
                        </div>
                    `;
                }
            }

            const userId_check = auth.currentUser?.uid;
            const isLiked = post.likedBy && userId_check && post.likedBy.includes(userId_check);

            let statusClass = 'inactive';
            if (currentUser && post.userId === currentUser.uid) {
                statusClass = 'active';
            }

            div.innerHTML = `
                <div class="post-header">
                    <div class="post-user-info">
                        <div class="profile-container" onclick="event.stopPropagation(); openProfileIframe('${userId}')">
                            <img src="${userImage}" alt="Profile" style="width:40px;height:40px;border-radius:50%;object-fit:cover;cursor:pointer;">
                            <span class="online-status ${statusClass}" data-userid="${userId}"></span>
                        </div>
                        <div class="post-meta">
                            <h4 onclick="event.stopPropagation(); openProfileIframe('${userId}')">${escapeHTML(userName)}</h4>
                            <span>${timestamp}</span>
                        </div>
                    </div>
                    <div class="post-options">
                        <i class="fa-solid fa-ellipsis" onclick="event.stopPropagation(); showToast('Post options clicked')"></i>
                    </div>
                </div>
                ${captionHTML}
                ${imageUrl ? `<div class="post-image-content"><img src="${imageUrl}" alt="Post image" loading="lazy" onclick="event.stopPropagation(); openPostDetail('${post.id}')"></div>` : ''}
                <div class="post-stats">
                    <div class="stat-left">
                        <div class="like-icon-circle"><i class="fa-solid fa-thumbs-up"></i></div>
                        <span class="like-count">${likes}</span>
                    </div>
                    <div class="stat-right">
                        <span class="comment-count" onclick="event.stopPropagation(); openPostDetail('${post.id}')" style="cursor:pointer;">${comments.length} comments</span>
                    </div>
                </div>
                <div class="post-actions">
                    <div class="action-btn like-btn ${isLiked ? 'liked' : ''}">${isLiked ? '<i class="fa-solid fa-thumbs-up"></i> Liked' : '<i class="fa-regular fa-thumbs-up"></i> Like'}</div>
                    <div class="action-btn comment-toggle-btn"><i class="fa-regular fa-comment"></i> Comment</div>
                    <div class="action-btn" onclick="event.stopPropagation(); showToast('Post shared successfully!')"><i class="fa-solid fa-share"></i> Share</div>
                </div>
                <div class="comments-section">
                    <div class="comments-list">
                        ${comments.slice(0, 3).map(c => 
                            `<div class="comment-item" onclick="event.stopPropagation(); openPostDetail('${post.id}')">
                                <b>${escapeHTML(c.userName || 'User')}:</b> ${escapeHTML(c.text)}
                            </div>`
                        ).join('')}
                        ${comments.length > 3 ? `<div class="comment-item" onclick="event.stopPropagation(); openPostDetail('${post.id}')" style="color:#1877f2;font-weight:600;">View all ${comments.length} comments</div>` : ''}
                    </div>
                </div>
            `;
            if (isBanner) div.classList.add('banner-post');

            // Real-time listener for user updates + status
            if (post.userId) {
                db.collection('users').doc(post.userId).onSnapshot((doc) => {
                    if (doc.exists) {
                        const data = doc.data();
                        const newName = data.fullName || data.displayName || post.userName;
                        const newPhoto = data.photoURL || post.userImage;
                        const nameEl = div.querySelector('.post-meta h4');
                        const imgEl = div.querySelector('.post-user-info img');
                        const statusEl = div.querySelector('.online-status');
                        if (nameEl && newName) nameEl.textContent = newName;
                        if (imgEl && newPhoto) imgEl.src = newPhoto;
                        if (statusEl) {
                            if (auth.currentUser && post.userId === auth.currentUser.uid) {
                                statusEl.className = 'online-status active';
                            } else {
                                statusEl.className = 'online-status ' + (data.status === 'online' ? 'active' : 'inactive');
                            }
                        }
                    }
                });
            }

            return div;
        }

        // ========== AUTH STATE ==========
        auth.onAuthStateChanged(async (user) => {
            if (user) {
                currentUser = user;
                await createUserDocument(user);
                setUserStatus(user.uid, 'online');

                loginOverlay.classList.remove('show');
                const headerPic = document.getElementById('header-profile-pic');
                if (headerPic && user.photoURL) headerPic.src = user.photoURL;
                if (headerStatusDot) headerStatusDot.className = 'online-dot';
                showToast('Welcome ' + (user.displayName || user.email?.split('@')[0] || 'User'));
                postsLoaded = 0;
                lastDoc = null;
                hasMore = true;
                loadPosts(false);
                setupInfiniteScroll();
                loadStories();
                startNotificationListeners(user.uid);

                // Listen to current user profile updates
                db.collection('users').doc(user.uid).onSnapshot((doc) => {
                    if (doc.exists) {
                        const data = doc.data();
                        const newName = data.fullName || data.displayName;
                        if (newName && newName !== user.displayName) {
                            user.updateProfile({ displayName: newName }).catch(() => {});
                        }
                        if (data.photoURL) {
                            const headerPic = document.getElementById('header-profile-pic');
                            if (headerPic) headerPic.src = data.photoURL;
                            user.updateProfile({ photoURL: data.photoURL }).catch(() => {});
                        }
                        if (headerStatusDot) {
                            headerStatusDot.className = 'online-dot' + (data.status === 'online' ? '' : ' offline');
                        }
                        document.querySelectorAll('#feed-container .feed-post').forEach(postEl => {
                            const userIdAttr = postEl.dataset.userId;
                            if (userIdAttr === user.uid) {
                                const nameEl = postEl.querySelector('.post-meta h4');
                                const imgEl = postEl.querySelector('.post-user-info img');
                                const statusEl = postEl.querySelector('.online-status');
                                if (nameEl) nameEl.textContent = newName || 'User';
                                if (imgEl && data.photoURL) imgEl.src = data.photoURL;
                                if (statusEl) statusEl.className = 'online-status active';
                            } else {
                                const statusEl = postEl.querySelector('.online-status');
                                if (statusEl && data.status !== undefined) {
                                    statusEl.className = 'online-status ' + (data.status === 'online' ? 'active' :
                                        'inactive');
                                }
                            }
                        });
                    }
                });

                document.addEventListener('visibilitychange', () => {
                    if (document.hidden) {
                        setUserStatus(user.uid, 'offline');
                        if (headerStatusDot) headerStatusDot.className = 'online-dot offline';
                    } else {
                        setUserStatus(user.uid, 'online');
                        if (headerStatusDot) headerStatusDot.className = 'online-dot';
                    }
                });

            } else {
                currentUser = null;
                loginOverlay.classList.add('show');
                const posts = feedContainer.querySelectorAll('.feed-post');
                posts.forEach(el => el.remove());
                feedLoading.style.display = 'block';
                feedLoading.innerHTML = 'Please login to see posts.';
                if (observer) observer.disconnect();
                if (headerStatusDot) headerStatusDot.className = 'online-dot offline';
                if (notifListenerUnsubscribe) { notifListenerUnsubscribe();
                    notifListenerUnsubscribe = null; }
            }
        });

        // ========== LOGIN ==========
        loginBtn.addEventListener('click', () => {

            openIframe('create-post.html', 'Create Post'); });

        // Modal for creating post
        const postModal = document.getElementById('post-modal');
        const closeModal = document.getElementById('close-modal');
        const modalText = document.getElementById('modal-text');
