<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Firebase Clone with Admin Upload</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #f9f9f9;
            color: #0f0f0f;
            padding-bottom: 80px;
        }

        /* Top Bar */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 16px;
            background-color: #ffffff;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .logo-area i.fa-youtube {
            color: #ff0000;
            font-size: 24px;
        }

        .logo-area span {
            font-size: 20px;
            font-weight: bold;
            letter-spacing: -1px;
        }

        .top-icons {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .top-icons i {
            font-size: 20px;
            color: #0f0f0f;
            cursor: pointer;
        }

        .notification-badge-wrapper {
            position: relative;
        }

        .badge {
            position: absolute;
            top: -5px;
            right: -8px;
            background-color: #ff0000;
            color: white;
            font-size: 10px;
            padding: 1px 5px;
            border-radius: 10px;
            font-weight: bold;
        }

        /* Admin Trigger / Upload Button */
        .upload-trigger-btn {
            background-color: #ff0000;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* Search Bar Overlay inside Top Bar */
        .search-bar-container {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #ffffff;
            padding: 0 16px;
            align-items: center;
            gap: 10px;
            z-index: 110;
        }

        .search-bar-container.active {
            display: flex;
        }

        .search-bar-container input {
            flex-grow: 1;
            padding: 8px 12px;
            border: 1px solid #ccc;
            border-radius: 20px 0 0 20px;
            font-size: 14px;
            outline: none;
        }

        .search-bar-container button {
            padding: 8px 16px;
            background-color: #f2f2f2;
            border: 1px solid #ccc;
            border-left: none;
            border-radius: 0 20px 20px 0;
            cursor: pointer;
            font-size: 14px;
        }

        .search-close-btn {
            background: none;
            border: none;
            font-size: 18px;
            cursor: pointer;
            color: #0f0f0f;
        }

        /* Filter Chips */
        .filter-container {
            display: flex;
            gap: 8px;
            padding: 8px 12px;
            background-color: #ffffff;
            overflow-x: auto;
            white-space: nowrap;
            scrollbar-width: none;
            border-bottom: 1px solid #e5e5e5;
        }

        .filter-container::-webkit-scrollbar {
            display: none;
        }

        .chip {
            padding: 6px 12px;
            background-color: #f2f2f2;
            color: #0f0f0f;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            border: none;
        }

        .chip.active {
            background-color: #000000;
            color: #ffffff;
        }

        .chip.explore {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 6px 10px;
        }

        /* Admin Upload Modal Panel */
        .admin-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .admin-content {
            background: white;
            padding: 20px;
            width: 90%;
            max-width: 400px;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .admin-content h3 {
            margin-bottom: 5px;
        }

        .admin-content input, .admin-content textarea, .admin-content select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
        }

        .admin-buttons {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 10px;
        }

        .admin-buttons button {
            padding: 8px 16px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            font-weight: 600;
        }

        .btn-cancel {
            background-color: #e5e5e5;
            color: #0f0f0f;
        }

        .btn-submit {
            background-color: #ff0000;
            color: white;
        }

        /* Feed / Video Cards */
        .feed {
            display: flex;
            flex-direction: column;
            gap: 16px;
            padding-top: 12px;
        }

        .video-card {
            background-color: #ffffff;
            padding-bottom: 12px;
        }

        .thumbnail-container {
            position: relative;
            width: 100%;
            background-color: #000;
            aspect-ratio: 16/9;
            cursor: pointer;
        }

        .thumbnail-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* Embed Player Container (Replaces thumbnail on click) */
        .embed-container {
            width: 100%;
            aspect-ratio: 16/9;
            background-color: #000;
            display: none;
        }

        .embed-container iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Video Details Section */
        .video-details {
            display: flex;
            gap: 12px;
            padding: 12px 12px 0 12px;
        }

        .channel-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            overflow: hidden;
            flex-shrink: 0;
        }

        .channel-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .video-meta {
            flex-grow: 1;
        }

        .video-title {
            font-size: 14px;
            font-weight: 500;
            color: #0f0f0f;
            line-height: 1.4;
            margin-bottom: 4px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .channel-info {
            font-size: 12px;
            color: #606060;
            line-height: 1.3;
        }

        .more-options {
            background: none;
            border: none;
            color: #0f0f0f;
            font-size: 16px;
            cursor: pointer;
            align-self: flex-start;
            padding: 4px;
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <div class="logo-area">
<i class="fa-solid fa-heart"></i>
            <span>SecretIntro Movies</span>
        </div>
        <div class="top-icons">
            <button style="display:none" class="upload-trigger-btn" onclick="toggleModal(true)"><i class="fa-solid fa-plus"></i> Post Video</button>
            <div class="notification-badge-wrapper">
                <i class="fa-regular fa-bell"></i>
                <span class="badge">9+</span>
            </div>
            <i class="fa-solid fa-magnifying-glass" onclick="toggleSearch(true)"></i>
        </div>

        <!-- Search Bar Overlay inside Top Bar -->
        <div class="search-bar-container" id="searchBarContainer">
            <button class="search-close-btn" onclick="toggleSearch(false)"><i class="fa-solid fa-arrow-left"></i></button>
            <input type="text" id="searchInput" placeholder="Search videos..." oninput="filterVideos()">
            <button onclick="filterVideos()"><i class="fa-solid fa-magnifying-glass"></i></button>
        </div>
    </div>

    <div class="filter-container">
        <div class="chip explore"><i class="fa-regular fa-compass"></i></div>
        <button class="chip active" onclick="filterByCategory('All', this)">All</button>
        <button class="chip" onclick="filterByCategory('Music', this)">Music</button>
        <button class="chip" onclick="filterByCategory('Mixes', this)">Mixes</button>
        <button class="chip" onclick="filterByCategory('Lo-fi', this)">Lo-fi</button>
        <button class="chip" onclick="filterByCategory('Music of Bengal', this)">Music of Bengal</button>
    </div>

    <div class="admin-modal" id="adminModal">
        <div class="admin-content">
            <h3>Upload New Video</h3>
            <input type="text" id="videoTitle" placeholder="Video Title & Channel Info">
            <input type="text" id="thumbImage" placeholder="Thumbnail Image URL">
            <select id="videoCategory">
                <option value="Music">Music</option>
                <option value="Mixes">Mixes</option>
                <option value="Lo-fi">Lo-fi</option>
                <option value="Music of Bengal">Music of Bengal</option>
            </select>
            <textarea id="iframeCode" placeholder='Paste iframe code here (e.g., <iframe src="..." ...></iframe>)' rows="4"></textarea>
            <div class="admin-buttons">
                <button class="btn-cancel" onclick="toggleModal(false)">Cancel</button>
                <button class="btn-submit" onclick="uploadVideoToFirebase()">Post Video</button>
            </div>
        </div>
    </div>

    <div class="feed" id="videoFeed">
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDOJaV7zMLhtA-_z1nkcdbtaa3w7M_0Fh4",
            authDomain: "money-generate-dbab3.firebaseapp.com",
            databaseURL: "https://money-generate-dbab3-default-rtdb.firebaseio.com",
            projectId: "money-generate-dbab3",
            storageBucket: "money-generate-dbab3.firebasestorage.app",
            messagingSenderId: "579756089926",
            appId: "1:579756089926:web:abbe35377e3657889be047"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let allVideosData = [];
        let currentCategory = 'All';

        // Toggle Upload Modal
        function toggleModal(show) {
            document.getElementById('adminModal').style.display = show ? 'flex' : 'none';
        }

        // Toggle Search Bar Overlay
        function toggleSearch(show) {
            const searchContainer = document.getElementById('searchBarContainer');
            if (show) {
                searchContainer.classList.add('active');
                document.getElementById('searchInput').focus();
            } else {
                searchContainer.classList.remove('active');
                document.getElementById('searchInput').value = '';
                renderVideos(allVideosData);
            }
        }

        // Upload Video details & category to Firestore
        async function uploadVideoToFirebase() {
            const title = document.getElementById('videoTitle').value;
            const thumbImage = document.getElementById('thumbImage').value;
            const category = document.getElementById('videoCategory').value;
            const iframeCode = document.getElementById('iframeCode').value;

            if (!title || !thumbImage || !iframeCode) {
                alert("Please fill in all required fields!");
                return;
            }

            try {
                await db.collection("videos").add({
                    title: title,
                    thumbnail: thumbImage,
                    category: category,
                    iframe: iframeCode,
                    timestamp: firebase.firestore.FieldValue.serverTimestamp()
                });

                alert("Video posted successfully!");
                document.getElementById('videoTitle').value = '';
                document.getElementById('thumbImage').value = '';
                document.getElementById('iframeCode').value = '';
                toggleModal(false);
            } catch (error) {
                console.error("Error adding document: ", error);
                alert("Failed to post video.");
            }
        }

        // Fetch & Real-time Listen Videos from Firestore
        function loadVideos() {
            db.collection("videos").orderBy("timestamp", "desc").onSnapshot((snapshot) => {
                allVideosData = [];
                snapshot.forEach((doc) => {
                    allVideosData.push({ id: doc.id, ...doc.data() });
                });
                filterVideos();
            });
        }

        // Filter by Category Chip
        function filterByCategory(category, element) {
            currentCategory = category;
            
            // Update active states on chips
            const chips = document.querySelectorAll('.filter-container .chip');
            chips.forEach(chip => chip.classList.remove('active'));
            if(element) element.classList.add('active');

            filterVideos();
        }

        // Combined Filter Function for Category and Search Input
        function filterVideos() {
            const searchQuery = document.getElementById('searchInput').value.toLowerCase().trim();
            
            const filtered = allVideosData.filter(data => {
                const matchesCategory = (currentCategory === 'All' || data.category === currentCategory);
                const matchesSearch = (data.title && data.title.toLowerCase().includes(searchQuery));
                return matchesCategory && matchesSearch;
            });

            renderVideos(filtered);
        }

        // Render Videos to Feed Container
        function renderVideos(videosArray) {
            const feedContainer = document.getElementById('videoFeed');
            feedContainer.innerHTML = "";
            
            if (videosArray.length === 0) {
                feedContainer.innerHTML = '<p style="text-align:center; color:#606060; padding:20px;">No videos found.</p>';
                return;
            }

            videosArray.forEach((data) => {
                const card = document.createElement('div');
                card.className = 'video-card';
                card.innerHTML = `
                    <div class="thumbnail-container" onclick="playVideo(this)">
                        <img src="${data.thumbnail}" alt="Thumbnail">
                    </div>
                    <div class="embed-container">
                        ${data.iframe}
                    </div>
                    <div class="video-details">
                        <div class="channel-avatar">
                            <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=200&q=80" alt="Avatar">
                        </div>
                        <div class="video-meta">
                            <div class="video-title">${data.title}</div>
                            <div class="channel-info">Dynamic Channel • 10K views • Just now</div>
                        </div>
                        <button class="more-options"><i class="fa-solid fa-ellipsis-vertical"></i></button>
                    </div>
                `;
                feedContainer.appendChild(card);
            });
        }

        // Handle Thumbnail Click to play Iframe Video Player seamlessly & Stop others
        function playVideo(element) {
            const allCards = document.querySelectorAll('.video-card');
            allCards.forEach(card => {
                const thumb = card.querySelector('.thumbnail-container');
                const embed = card.querySelector('.embed-container');
                if (thumb && embed) {
                    thumb.style.display = 'block';
                    embed.style.display = 'none';
                    const iframe = embed.querySelector('iframe');
                    if (iframe) {
                        const originalSrc = iframe.src;
                        iframe.src = "";
                        iframe.src = originalSrc;
                    }
                }
            });

            const currentCard = element.closest('.video-card');
            const thumbContainer = currentCard.querySelector('.thumbnail-container');
            const embedContainer = currentCard.querySelector('.embed-container');

            thumbContainer.style.display = 'none';
            embedContainer.style.display = 'block';

            const iframe = embedContainer.querySelector('iframe');
            if(iframe && !iframe.src.includes('autoplay=1')) {
                iframe.src += (iframe.src.includes('?') ? '&' : '?') + 'autoplay=1';
            }
        }

        window.onload = loadVideos;
    </script>
</body>
</html>
