<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>Upload Story · SecretIntro</title>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <!-- Google Fonts (Inter) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet" />
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js">
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            background: #f0f2f5;
            color: #1a1a2e;
            font-family: 'Inter', Helvetica, Arial, sans-serif;
            overflow: hidden;
        }

        #fullscreen-container {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
            position: relative;
            background: linear-gradient(145deg, #f8f9fc, #eef0f4);
            overflow: hidden;
        }

        #fullscreen-container::before {
            content: '';
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(24, 119, 242, 0.04) 0%, transparent 70%);
            top: -20%;
            right: -20%;
            border-radius: 50%;
            z-index: 0;
            animation: floatGlow 14s ease-in-out infinite alternate;
        }
        #fullscreen-container::after {
            content: '';
            position: absolute;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(124, 58, 237, 0.03) 0%, transparent 70%);
            bottom: -20%;
            left: -20%;
            border-radius: 50%;
            z-index: 0;
            animation: floatGlow 10s ease-in-out infinite alternate-reverse;
        }

        @keyframes floatGlow {
            0% {
                transform: translate(0, 0) scale(1);
            }
            100% {
                transform: translate(30px, -20px) scale(1.05);
            }
        }

        .story-upload-card {
            position: relative;
            z-index: 1;
            background: #ffffff;
            border-radius: 32px;
            max-width: 500px;
            width: 100%;
            padding: 40px 32px 32px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.07), 0 2px 10px rgba(0, 0, 0, 0.02);
            text-align: center;
            border: 1px solid rgba(0, 0, 0, 0.04);
            transition: 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            max-height: 95vh;
            overflow-y: auto;
        }

        .story-upload-card::-webkit-scrollbar {
            width: 3px;
        }
        .story-upload-card::-webkit-scrollbar-track {
            background: transparent;
        }
        .story-upload-card::-webkit-scrollbar-thumb {
            background: rgba(0, 0, 0, 0.08);
            border-radius: 10px;
        }

        .story-upload-card .logo {
            font-size: 34px;
            font-weight: 700;
            letter-spacing: -0.5px;
            color: #1877f2;
            margin-bottom: 2px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .story-upload-card .logo i {
            color: #1877f2;
            font-size: 30px;
        }

        .story-upload-card .sub {
            color: #6b7280;
            font-size: 14px;
            font-weight: 400;
            margin-bottom: 28px;
            letter-spacing: 0.2px;
        }
        .story-upload-card .sub span {
            color: #1a1a2e;
            font-weight: 500;
        }

        .drop-zone {
            border: 2px dashed #d1d5db;
            border-radius: 24px;
            padding: 44px 20px;
            background: #fafbfc;
            cursor: pointer;
            transition: 0.3s ease;
            position: relative;
        }
        .drop-zone:hover {
            border-color: #1877f2;
            background: #f0f7ff;
        }
        .drop-zone.dragover {
            border-color: #1877f2;
            background: #e7f1ff;
            transform: scale(1.01);
            box-shadow: 0 0 40px rgba(24, 119, 242, 0.06);
        }
        .drop-zone .icon-wrap {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 14px;
        }
        .drop-zone .icon-wrap i {
            font-size: 44px;
            color: #9ca3af;
            transition: 0.3s;
        }
        .drop-zone:hover .icon-wrap i {
            color: #6b7280;
        }
        .drop-zone .icon-wrap i:first-child {
            color: #1877f2;
            opacity: 0.7;
        }
        .drop-zone h4 {
            font-size: 18px;
            font-weight: 600;
            color: #1a1a2e;
            letter-spacing: -0.2px;
        }
        .drop-zone p {
            color: #6b7280;
            font-size: 14px;
            margin-top: 6px;
            font-weight: 400;
        }
        .drop-zone .file-types {
            color: #9ca3af;
            font-size: 12px;
            margin-top: 12px;
            letter-spacing: 0.3px;
        }
        .file-input {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
        }

        .preview-container {
            margin-top: 20px;
            border-radius: 20px;
            overflow: hidden;
            background: #f3f4f6;
            position: relative;
            display: none;
            max-height: 300px;
            border: 1px solid #e5e7eb;
        }
        .preview-container img,
        .preview-container video {
            width: 100%;
            max-height: 300px;
            object-fit: contain;
            display: block;
            background: #ffffff;
        }
        .preview-container .remove-file {
            position: absolute;
            top: 12px;
            right: 12px;
            background: rgba(0, 0, 0, 0.65);
            color: #fff;
            border: none;
            border-radius: 50%;
            width: 36px;
            height: 36px;
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
            backdrop-filter: blur(4px);
        }
        .preview-container .remove-file:hover {
            background: #dc2626;
            transform: scale(1.05);
        }

        .file-info {
            margin-top: 14px;
            font-size: 13px;
            color: #6b7280;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            padding: 0 4px;
        }
        .file-info .name {
            font-weight: 500;
            color: #1a1a2e;
            max-width: 200px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .file-info .size {
            background: #f3f4f6;
            padding: 2px 14px;
            border-radius: 20px;
            font-size: 12px;
            color: #4b5563;
        }

        .upload-btn {
            width: 100%;
            padding: 16px;
            background: #1877f2;
            border: none;
            border-radius: 60px;
            color: #fff;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.25s ease;
            margin-top: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            box-shadow: 0 4px 16px rgba(24, 119, 242, 0.2);
            letter-spacing: 0.2px;
            font-family: 'Inter', sans-serif;
        }
        .upload-btn:hover:not(:disabled) {
            background: #1a6dd4;
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(24, 119, 242, 0.3);
        }
        .upload-btn:active:not(:disabled) {
            transform: translateY(0px);
        }
        .upload-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        .upload-btn i {
            font-size: 18px;
        }

        .progress-wrapper {
            margin-top: 18px;
            display: none;
        }
        .progress-bar {
            width: 100%;
            height: 4px;
            background: #e5e7eb;
            border-radius: 10px;
            overflow: hidden;
            margin-top: 6px;
        }
        .progress-fill {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #1877f2, #6c8cff);
            border-radius: 10px;
            transition: width 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }
        .progress-text {
            font-size: 13px;
            color: #6b7280;
            margin-top: 6px;
            font-weight: 400;
            letter-spacing: 0.3px;
        }

        .toast-msg {
            background: #1a1a2e;
            color: #fff;
            padding: 14px 28px;
            border-radius: 60px;
            font-size: 14px;
            font-weight: 500;
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            display: none;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
            max-width: 90%;
            text-align: center;
            font-family: 'Inter', sans-serif;
            letter-spacing: 0.2px;
        }

        .back-home {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-top: 24px;
            color: #6b7280;
            text-decoration: none;
            font-weight: 500;
            font-size: 14px;
            cursor: pointer;
            transition: 0.2s;
            font-family: 'Inter', sans-serif;
            letter-spacing: 0.2px;
        }
        .back-home:hover {
            color: #1877f2;
        }
        .back-home i {
            font-size: 14px;
            transition: 0.2s;
        }
        .back-home:hover i {
            transform: translateX(-3px);
        }

        @media (max-width: 480px) {
            #fullscreen-container {
                padding: 12px;
                background: #f8f9fc;
            }
            .story-upload-card {
                padding: 28px 18px 24px;
                border-radius: 24px;
                box-shadow: 0 12px 40px rgba(0, 0, 0, 0.06);
            }
            .story-upload-card .logo {
                font-size: 26px;
            }
            .drop-zone {
                padding: 28px 12px;
                border-radius: 18px;
            }
            .drop-zone .icon-wrap i {
                font-size: 32px;
            }
            .drop-zone h4 {
                font-size: 15px;
            }
            .upload-btn {
                font-size: 15px;
                padding: 14px;
            }
            .preview-container {
                max-height: 200px;
            }
            .preview-container img,
            .preview-container video {
                max-height: 200px;
            }
            .story-upload-card .sub {
                font-size: 13px;
                margin-bottom: 20px;
            }
        }
        @media (max-width: 380px) {
            .story-upload-card {
                padding: 20px 12px 18px;
                border-radius: 20px;
            }
            .drop-zone {
                padding: 20px 8px;
            }
            .drop-zone .icon-wrap i {
                font-size: 26px;
            }
            .drop-zone h4 {
                font-size: 13px;
            }
            .upload-btn {
                font-size: 13px;
                padding: 12px;
            }
            .file-info .name {
                max-width: 120px;
                font-size: 12px;
            }
        }
    </style>
</head>
<body>

    <!-- TOAST -->
    <div id="toast" class="toast-msg"></div>

    <div id="fullscreen-container">
        <div class="story-upload-card">
            <div class="logo">
                <i class="fa-regular fa-star"></i> SecretIntro
            </div>
            <div class="sub">
                Share your story · <span>disappears in 24h</span>
            </div>

            <!-- Drop zone -->
            <div class="drop-zone" id="dropZone">
                <div class="icon-wrap">
                    <i class="fa-regular fa-image"></i>
                    <i class="fa-regular fa-file-video"></i>
                </div>
                <h4>Tap to select image or video</h4>
                <p>Max 50MB · auto-delete after 24h</p>
                <div class="file-types">JPG, PNG, MP4, MOV, AVI, WEBM</div>
                <input type="file" class="file-input" id="fileInput" accept="image/*,video/*">
            </div>

            <!-- Preview -->
            <div class="preview-container" id="previewContainer">
                <button class="remove-file" id="removeFileBtn"><i class="fa-solid fa-xmark"></i></button>
                <img id="previewImage" src="" alt="Preview" style="display:none;">
                <video id="previewVideo" src="" controls style="display:none;"></video>
            </div>

            <!-- File info -->
            <div class="file-info" id="fileInfo" style="display:none;">
                <span class="name" id="fileName">file.mp4</span>
                <span class="size" id="fileSize">0 MB</span>
            </div>

            <!-- Upload button -->
            <button class="upload-btn" id="uploadBtn" disabled>
                <i class="fa-regular fa-cloud-arrow-up"></i> Upload Story
            </button>

            <!-- Progress -->
            <div class="progress-wrapper" id="progressWrapper">
                <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
                <div class="progress-text" id="progressText">0%</div>
            </div>

            <a class="back-home" id="backHomeBtn">
                <i class="fa-solid fa-arrow-left"></i> Back to Home
            </a>
        </div>
    </div>

    <script>
        // ========== FIREBASE CONFIG ==========
        const firebaseConfig = {
            apiKey: "AIzaSyDOJaV7zMLhtA-_z1nkcdbtaa3w7M_0Fh4",
            authDomain: "money-generate-dbab3.firebaseapp.com",
            databaseURL: "https://money-generate-dbab3-default-rtdb.firebaseio.com",
            projectId: "money-generate-dbab3",
            storageBucket: "money-generate-dbab3.firebasestorage.app",
            messagingSenderId: "579756089926",
            appId: "1:579756089926:web:abbe35377e3657889be047"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // ========== CLOUDINARY CONFIG ==========
        const CLOUDINARY_URL = 'https://api.cloudinary.com/v1_1/dhvtgzy5x/upload';
        const UPLOAD_PRESET = 'Rosenews';

        // ========== DOM REFS ==========
        const fileInput = document.getElementById('fileInput');
        const dropZone = document.getElementById('dropZone');
        const previewContainer = document.getElementById('previewContainer');
        const previewImage = document.getElementById('previewImage');
        const previewVideo = document.getElementById('previewVideo');
        const removeFileBtn = document.getElementById('removeFileBtn');
        const fileInfo = document.getElementById('fileInfo');
        const fileName = document.getElementById('fileName');
        const fileSize = document.getElementById('fileSize');
        const uploadBtn = document.getElementById('uploadBtn');
        const progressWrapper = document.getElementById('progressWrapper');
        const progressFill = document.getElementById('progressFill');
        const progressText = document.getElementById('progressText');
        const toast = document.getElementById('toast');
        const backHomeBtn = document.getElementById('backHomeBtn');

        let selectedFile = null;
        let fileType = '';
        let uploadedFileUrl = '';

        // ========== TOAST ==========
        let toastTimer;

        function showToast(msg) {
            toast.textContent = msg;
            toast.style.display = 'block';
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => { toast.style.display = 'none'; }, 3200);
        }

        // ========== FILE HANDLING ==========
        function handleFile(file) {
            if (file.size > 50 * 1024 * 1024) {
                showToast('⚠️ File exceeds 50MB limit');
                resetUpload();
                return;
            }

            const validImageTypes = ['image/jpeg', 'image/png', 'image/gif', 'image/webp'];
            const validVideoTypes = ['video/mp4', 'video/quicktime', 'video/x-msvideo', 'video/webm', 'video/avi', 'video/mov'];

            if (validImageTypes.includes(file.type)) {
                fileType = 'image';
            } else if (validVideoTypes.includes(file.type)) {
                fileType = 'video';
            } else {
                showToast('⚠️ Unsupported file type. Use image or video.');
                resetUpload();
                return;
            }

            selectedFile = file;
            previewContainer.style.display = 'block';

            const reader = new FileReader();
            reader.onload = (e) => {
                const url = e.target.result;
                if (fileType === 'image') {
                    previewImage.src = url;
                    previewImage.style.display = 'block';
                    previewVideo.style.display = 'none';
                    previewVideo.src = '';
                } else {
                    previewVideo.src = url;
                    previewVideo.style.display = 'block';
                    previewImage.style.display = 'none';
                    previewImage.src = '';
                }
                fileInfo.style.display = 'flex';
                fileName.textContent = file.name;
                const sizeMB = (file.size / (1024 * 1024)).toFixed(2);
                fileSize.textContent = sizeMB + ' MB';
                uploadBtn.disabled = false;
            };
            reader.readAsDataURL(file);
        }

        function resetUpload() {
            selectedFile = null;
            fileType = '';
            fileInput.value = '';
            previewContainer.style.display = 'none';
            previewImage.style.display = 'none';
            previewImage.src = '';
            previewVideo.style.display = 'none';
            previewVideo.src = '';
            fileInfo.style.display = 'none';
            uploadBtn.disabled = true;
            progressWrapper.style.display = 'none';
            progressFill.style.width = '0%';
            progressText.textContent = '0%';
        }

        removeFileBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            resetUpload();
        });

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                handleFile(e.target.files[0]);
            }
        });

        // Drag & drop
        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('dragover');
        });
        dropZone.addEventListener('dragleave', () => {
            dropZone.classList.remove('dragover');
        });
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            if (e.dataTransfer.files.length > 0) {
                handleFile(e.dataTransfer.files[0]);
            }
        });

        // ========== GENERATE VIDEO THUMBNAIL ==========
        function generateVideoThumbnail(videoUrl) {
            return new Promise((resolve) => {
                const video = document.createElement('video');
                video.crossOrigin = 'anonymous';
                video.src = videoUrl;
                video.muted = true;
                video.playsInline = true;
                video.preload = 'metadata';

                video.addEventListener('loadeddata', () => {
                    video.currentTime = 0.5;
                });

                video.addEventListener('seeked', () => {
                    try {
                        const canvas = document.createElement('canvas');
                        canvas.width = video.videoWidth || 640;
                        canvas.height = video.videoHeight || 480;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                        const thumbnail = canvas.toDataURL('image/jpeg', 0.8);
                        resolve(thumbnail);
                    } catch (e) {
                        resolve(null);
                    }
                    video.remove();
                });

                video.addEventListener('error', () => {
                    resolve(null);
                    video.remove();
                });

                // Fallback
                setTimeout(() => {
                    if (video) {
                        try {
                            const canvas = document.createElement('canvas');
                            canvas.width = 640;
                            canvas.height = 480;
                            const ctx = canvas.getContext('2d');
                            ctx.fillStyle = '#1877f2';
                            ctx.fillRect(0, 0, 640, 480);
                            ctx.fillStyle = '#fff';
                            ctx.font = '30px Arial';
                            ctx.textAlign = 'center';
                            ctx.fillText('🎬 Video', 320, 240);
                            const thumbnail = canvas.toDataURL('image/jpeg', 0.7);
                            resolve(thumbnail);
                        } catch (e) {
                            resolve(null);
                        }
                        video.remove();
                    }
                }, 5000);
            });
        }

        // ========== UPLOAD TO CLOUDINARY ==========
        function uploadToCloudinary(file, onProgress) {
            return new Promise((resolve, reject) => {
                const formData = new FormData();
                formData.append('file', file);
                formData.append('upload_preset', UPLOAD_PRESET);
                const resourceType = fileType === 'video' ? 'video' : 'image';
                formData.append('resource_type', resourceType);

                const xhr = new XMLHttpRequest();
                xhr.open('POST', CLOUDINARY_URL, true);

                xhr.upload.addEventListener('progress', (e) => {
                    if (e.lengthComputable) {
                        const percent = Math.round((e.loaded / e.total) * 100);
                        onProgress(percent);
                    }
                });

                xhr.onload = () => {
                    if (xhr.status === 200) {
                        try {
                            resolve(JSON.parse(xhr.responseText));
                        } catch { reject(new Error('Invalid response')); }
                    } else {
                        reject(new Error(`Upload failed (${xhr.status})`));
                    }
                };
                xhr.onerror = () => reject(new Error('Network error'));
                xhr.send(formData);
            });
        }

        // ========== UPLOAD STORY ==========
        uploadBtn.addEventListener('click', async () => {
            if (!selectedFile) return;
            const user = auth.currentUser;
            if (!user) {
                showToast('⚠️ Please login first');
                return;
            }

            let userName = user.displayName || user.email?.split('@')[0] || 'User';
            let userImage = user.photoURL || 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=100&q=80';

            uploadBtn.disabled = true;
            uploadBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Uploading...';
            progressWrapper.style.display = 'block';
            progressFill.style.width = '0%';
            progressText.textContent = '0%';

            try {
                // Upload to Cloudinary
                const result = await uploadToCloudinary(selectedFile, (percent) => {
                    progressFill.style.width = percent + '%';
                    progressText.textContent = percent + '%';
                });

                const cloudinaryUrl = result.secure_url;
                if (!cloudinaryUrl) throw new Error('No URL from Cloudinary');

                // Generate thumbnail for video
                let thumbnailUrl = userImage;
                if (fileType === 'video') {
                    try {
                        const thumbnailData = await generateVideoThumbnail(cloudinaryUrl);
                        if (thumbnailData) {
                            // Upload thumbnail to Cloudinary as well
                            const thumbBlob = await fetch(thumbnailData).then(r => r.blob());
                            const thumbFormData = new FormData();
                            thumbFormData.append('file', thumbBlob, 'thumbnail.jpg');
                            thumbFormData.append('upload_preset', UPLOAD_PRESET);
                            thumbFormData.append('resource_type', 'image');

                            const thumbXhr = new XMLHttpRequest();
                            thumbXhr.open('POST', CLOUDINARY_URL, false);
                            thumbXhr.send(thumbFormData);
                            if (thumbXhr.status === 200) {
                                const thumbResult = JSON.parse(thumbXhr.responseText);
                                thumbnailUrl = thumbResult.secure_url || userImage;
                            }
                        }
                    } catch (e) {
                        console.log('Thumbnail generation error:', e);
                        thumbnailUrl = userImage;
                    }
                }

                // Save to Firestore
                const storyRef = db.collection('stories').doc(user.uid);
                const storyData = {
                    uid: user.uid,
                    userName: userName,
                    userImage: userImage,
                    imageUrl: cloudinaryUrl,
                    thumbnail: thumbnailUrl,
                    mediaType: fileType,
                    timestamp: firebase.firestore.FieldValue.serverTimestamp(),
                    createdAt: new Date().toISOString(),
                    cloudinaryPublicId: result.public_id,
                    expiresAt: firebase.firestore.Timestamp.fromDate(new Date(Date.now() + 24 * 60 * 60 * 1000)),
                    expiresIn: '24h'
                };

                await storyRef.set(storyData, { merge: true });

                // Schedule deletion after 24h
                setTimeout(() => {
                    storyRef.delete().catch(() => {});
                }, 24 * 60 * 60 * 1000);

                progressFill.style.width = '100%';
                progressText.textContent = '100%';

                showToast('✅ Story uploaded! Auto-deletes in 24h');
                setTimeout(() => {
                    window.location.href = '../homepage.html';
                }, 1200);

            } catch (error) {
                console.error('Upload error:', error);
                showToast('❌ Upload failed: ' + error.message);
                uploadBtn.disabled = false;
                uploadBtn.innerHTML = '<i class="fa-regular fa-cloud-arrow-up"></i> Upload Story';
                progressWrapper.style.display = 'none';
                progressFill.style.width = '0%';
                progressText.textContent = '0%';
            }
        });

        // ========== BACK TO HOME ==========
        backHomeBtn.addEventListener('click', (e) => {
            e.preventDefault();
            window.location.href = 'homepage.html';
        });

        // ========== AUTH ==========
        auth.onAuthStateChanged((user) => {
            if (!user) {
                showToast('⚠️ Please login to upload a story');
                uploadBtn.disabled = true;
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 1800);
            } else {
                console.log('👤 Logged in:', user.displayName || user.email);
            }
        });

        // ========== INIT ==========
        resetUpload();
        console.log('📸 Full-screen Story Upload with 24h auto-delete');
        console.log('🔹 Max 50MB · Cloudinary + Firestore');
        console.log('🎬 Video thumbnail auto-generated');
    </script>

</body>
</html>
