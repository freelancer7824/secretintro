<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>স্টোরি আপলোড - SecretIntro</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js">
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html,
        body {
            width: 100%;
            min-height: 100vh;
            background: #f0f2f5;
            color: #1a1a2e;
            font-family: 'Inter', Helvetica, Arial, sans-serif;
            overflow-x: hidden;
        }
        .toast-msg {
            background: #1a1a2e;
            color: #fff;
            padding: 14px 28px;
            border-radius: 60px;
            font-size: 14px;
            font-weight: 500;
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            display: none;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
            max-width: 90%;
            text-align: center;
            font-family: 'Inter', sans-serif;
            pointer-events: none;
        }
        #fullscreen-container {
            width: 100%;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
            position: relative;
            background: linear-gradient(145deg, #f8f9fc, #eef0f4);
        }
        #fullscreen-container::before {
            content: '';
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(24, 119, 242, 0.04) 0%, transparent 70%);
            top: -20%;
            right: -20%;
            border-radius: 50%;
            z-index: 0;
            animation: floatGlow 14s ease-in-out infinite alternate;
        }
        #fullscreen-container::after {
            content: '';
            position: absolute;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(124, 58, 237, 0.03) 0%, transparent 70%);
            bottom: -20%;
            left: -20%;
            border-radius: 50%;
            z-index: 0;
            animation: floatGlow 10s ease-in-out infinite alternate-reverse;
        }
        @keyframes floatGlow {
            0% {
                transform: translate(0, 0) scale(1);
            }
            100% {
                transform: translate(30px, -20px) scale(1.05);
            }
        }
        .story-upload-card {
            position: relative;
            z-index: 1;
            background: #ffffff;
            border-radius: 32px;
            max-width: 500px;
            width: 100%;
            padding: 40px 32px 32px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.07), 0 2px 10px rgba(0, 0, 0, 0.02);
            text-align: center;
            border: 1px solid rgba(0, 0, 0, 0.04);
            transition: 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            max-height: 95vh;
            overflow-y: auto;
        }
        .story-upload-card::-webkit-scrollbar {
            width: 3px;
        }
        .story-upload-card::-webkit-scrollbar-track {
            background: transparent;
        }
        .story-upload-card::-webkit-scrollbar-thumb {
            background: rgba(0, 0, 0, 0.08);
            border-radius: 10px;
        }
        .story-upload-card .logo {
            font-size: clamp(26px, 5vw, 34px);
            font-weight: 700;
            letter-spacing: -0.5px;
            color: #1877f2;
            margin-bottom: 2px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .story-upload-card .logo i {
            color: #1877f2;
            font-size: clamp(24px, 4vw, 30px);
        }
        .story-upload-card .sub {
            color: #6b7280;
            font-size: clamp(13px, 2vw, 15px);
            font-weight: 400;
            margin-bottom: 28px;
            letter-spacing: 0.2px;
        }
        .story-upload-card .sub span {
            color: #1a1a2e;
            font-weight: 500;
        }

        /* ===== USER INFO ===== */
        .user-info-bar {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            background: #f8f9fc;
            border-radius: 16px;
            margin-bottom: 20px;
            border: 1px solid #eef0f4;
        }
        .user-info-bar .avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #1877f2;
        }
        .user-info-bar .user-details {
            text-align: left;
            flex: 1;
        }
        .user-info-bar .user-details .name {
            font-weight: 600;
            font-size: 15px;
            color: #1a1a2e;
        }
        .user-info-bar .user-details .email {
            font-size: 12px;
            color: #6b7280;
        }
        .user-info-bar .status-badge {
            background: #31a24c;
            color: #fff;
            font-size: 10px;
            padding: 3px 12px;
            border-radius: 12px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* ===== DROP ZONE ===== */
        .drop-zone {
            border: 2px dashed #d1d5db;
            border-radius: 24px;
            padding: clamp(28px, 5vw, 44px) clamp(12px, 3vw, 20px);
            background: #fafbfc;
            cursor: pointer;
            transition: 0.3s ease;
            position: relative;
        }
        .drop-zone:active {
            transform: scale(0.98);
        }
        .drop-zone.dragover {
            border-color: #1877f2;
            background: #e7f1ff;
            transform: scale(1.01);
            box-shadow: 0 0 40px rgba(24, 119, 242, 0.06);
        }
        .drop-zone .icon-wrap {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 14px;
        }
        .drop-zone .icon-wrap i {
            font-size: clamp(32px, 6vw, 44px);
            color: #9ca3af;
            transition: 0.3s;
        }
        .drop-zone .icon-wrap i:first-child {
            color: #1877f2;
            opacity: 0.7;
        }
        .drop-zone h4 {
            font-size: clamp(15px, 2.5vw, 18px);
            font-weight: 600;
            color: #1a1a2e;
            letter-spacing: -0.2px;
        }
        .drop-zone p {
            color: #6b7280;
            font-size: clamp(13px, 2vw, 15px);
            margin-top: 6px;
            font-weight: 400;
        }
        .drop-zone .file-types {
            color: #9ca3af;
            font-size: clamp(11px, 1.5vw, 13px);
            margin-top: 12px;
            letter-spacing: 0.3px;
        }
        .file-input {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
        }

        /* ===== PREVIEW ===== */
        .preview-container {
            margin-top: 20px;
            border-radius: 20px;
            overflow: hidden;
            background: #f3f4f6;
            position: relative;
            display: none;
            max-height: 300px;
            border: 1px solid #e5e7eb;
        }
        .preview-container.show {
            display: block;
        }
        .preview-container img,
        .preview-container video {
            width: 100%;
            max-height: 300px;
            object-fit: contain;
            display: block;
            background: #ffffff;
        }
        .preview-container .remove-file {
            position: absolute;
            top: 12px;
            right: 12px;
            background: rgba(0, 0, 0, 0.65);
            color: #fff;
            border: none;
            border-radius: 50%;
            width: 36px;
            height: 36px;
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
            backdrop-filter: blur(4px);
        }
        .preview-container .remove-file:active {
            background: #dc2626;
            transform: scale(0.9);
        }

        /* ===== FILE INFO ===== */
        .file-info {
            margin-top: 14px;
            font-size: clamp(12px, 1.5vw, 14px);
            color: #6b7280;
            display: none;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            padding: 0 4px;
        }
        .file-info.show {
            display: flex;
        }
        .file-info .name {
            font-weight: 500;
            color: #1a1a2e;
            max-width: 200px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .file-info .size {
            background: #f3f4f6;
            padding: 2px 14px;
            border-radius: 20px;
            font-size: 12px;
            color: #4b5563;
        }

        /* ===== UPLOAD BUTTON ===== */
        .upload-btn {
            width: 100%;
            padding: clamp(14px, 2.5vw, 18px);
            background: #1877f2;
            border: none;
            border-radius: 60px;
            color: #fff;
            font-size: clamp(15px, 2.5vw, 18px);
            font-weight: 600;
            cursor: pointer;
            transition: 0.25s ease;
            margin-top: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            box-shadow: 0 4px 16px rgba(24, 119, 242, 0.2);
            letter-spacing: 0.2px;
            font-family: 'Inter', sans-serif;
            min-height: 52px;
        }
        .upload-btn:active:not(:disabled) {
            transform: scale(0.97);
        }
        .upload-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        .upload-btn i {
            font-size: clamp(16px, 2vw, 20px);
        }

        /* ===== PROGRESS ===== */
        .progress-wrapper {
            margin-top: 18px;
            display: none;
        }
        .progress-wrapper.show {
            display: block;
        }
        .progress-bar {
            width: 100%;
            height: 4px;
            background: #e5e7eb;
            border-radius: 10px;
            overflow: hidden;
            margin-top: 6px;
        }
        .progress-fill {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #1877f2, #6c8cff);
            border-radius: 10px;
            transition: width 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }
        .progress-text {
            font-size: 13px;
            color: #6b7280;
            margin-top: 6px;
            font-weight: 400;
            letter-spacing: 0.3px;
        }

        /* ===== BACK HOME ===== */
        .back-home {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-top: 24px;
            color: #6b7280;
            text-decoration: none;
            font-weight: 500;
            font-size: clamp(13px, 2vw, 15px);
            cursor: pointer;
            transition: 0.2s;
            font-family: 'Inter', sans-serif;
            letter-spacing: 0.2px;
            padding: 8px 16px;
            border-radius: 30px;
        }
        .back-home:active {
            background: #f0f2f5;
        }
        .back-home i {
            font-size: 14px;
            transition: 0.2s;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 480px) {
            #fullscreen-container {
                padding: 12px;
                background: #f8f9fc;
            }
            .story-upload-card {
                padding: 28px 18px 24px;
                border-radius: 24px;
                box-shadow: 0 12px 40px rgba(0, 0, 0, 0.06);
            }
            .drop-zone {
                padding: 24px 12px;
                border-radius: 18px;
            }
            .drop-zone .icon-wrap i {
                font-size: 28px;
            }
            .drop-zone h4 {
                font-size: 14px;
            }
            .upload-btn {
                font-size: 14px;
                padding: 14px;
                min-height: 46px;
            }
            .preview-container {
                max-height: 200px;
            }
            .preview-container img,
            .preview-container video {
                max-height: 200px;
            }
            .story-upload-card .sub {
                font-size: 12px;
                margin-bottom: 20px;
            }
            .file-info .name {
                max-width: 120px;
                font-size: 12px;
            }
            .user-info-bar {
                padding: 10px 12px;
            }
            .user-info-bar .avatar {
                width: 36px;
                height: 36px;
            }
            .user-info-bar .user-details .name {
                font-size: 13px;
            }
        }
        @media (max-width: 380px) {
            .story-upload-card {
                padding: 20px 12px 18px;
                border-radius: 20px;
            }
            .drop-zone {
                padding: 16px 8px;
                border-radius: 14px;
            }
            .drop-zone .icon-wrap i {
                font-size: 22px;
            }
            .drop-zone h4 {
                font-size: 12px;
            }
            .drop-zone p {
                font-size: 11px;
            }
            .drop-zone .file-types {
                font-size: 10px;
            }
            .upload-btn {
                font-size: 12px;
                padding: 12px;
                min-height: 40px;
            }
            .file-info .name {
                max-width: 80px;
                font-size: 11px;
            }
            .file-info .size {
                font-size: 10px;
                padding: 2px 10px;
            }
            .back-home {
                font-size: 12px;
            }
            .user-info-bar .avatar {
                width: 30px;
                height: 30px;
            }
            .user-info-bar .user-details .name {
                font-size: 12px;
            }
            .user-info-bar .status-badge {
                font-size: 9px;
                padding: 2px 8px;
            }
        }
        @media (min-width: 768px) {
            .preview-container {
                max-height: 400px;
            }
            .preview-container img,
            .preview-container video {
                max-height: 400px;
            }
            .story-upload-card {
                padding: 48px 40px 36px;
            }
        }
    </style>
</head>
<body>

    <div id="toast" class="toast-msg"></div>

    <div id="fullscreen-container">
        <div class="story-upload-card">
            <!-- Logo -->
            <div class="logo">
                <i class="fa-regular fa-star"></i> SecretIntro
            </div>
            <div class="sub">
                আপনার স্টোরি শেয়ার করুন · <span>২৪ ঘন্টায় মুছে যাবে</span>
            </div>

            <!-- User Info -->
            <div class="user-info-bar" id="userInfoBar" style="display:none;">
                <img class="avatar" id="userAvatar" src="" alt="Avatar">
                <div class="user-details">
                    <div class="name" id="userName">লোড হচ্ছে...</div>
                    <div class="email" id="userEmail">user@email.com</div>
                </div>
                <span class="status-badge"><i class="fa-solid fa-circle" style="font-size:8px;"></i> অনলাইন</span>
            </div>

            <!-- Drop Zone -->
            <div class="drop-zone" id="dropZone">
                <div class="icon-wrap">
                    <i class="fa-regular fa-image"></i>
                    <i class="fa-regular fa-file-video"></i>
                </div>
                <h4>ছবি বা ভিডিও সিলেক্ট করুন</h4>
                <p>সর্বোচ্চ ৫০MB · ২৪ ঘন্টা পরে মুছে যাবে</p>
                <div class="file-types">JPG, PNG, MP4, MOV, AVI, WEBM</div>
                <input type="file" class="file-input" id="fileInput" accept="image/*,video/*">
            </div>

            <!-- Preview -->
            <div class="preview-container" id="previewContainer">
                <button class="remove-file" id="removeFileBtn"><i class="fa-solid fa-xmark"></i></button>
                <img id="previewImage" src="" alt="প্রিভিউ" style="display:none;">
                <video id="previewVideo" src="" controls style="display:none;"></video>
            </div>

            <!-- File Info -->
            <div class="file-info" id="fileInfo">
                <span class="name" id="fileName">file.mp4</span>
                <span class="size" id="fileSize">0 MB</span>
            </div>

            <!-- Upload Button -->
            <button class="upload-btn" id="uploadBtn" disabled>
                <i class="fa-regular fa-cloud-arrow-up"></i> স্টোরি আপলোড করুন
            </button>

            <!-- Progress -->
            <div class="progress-wrapper" id="progressWrapper">
                <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
                <div class="progress-text" id="progressText">0%</div>
            </div>

            <!-- Back Home -->
            <a class="back-home" id="backHomeBtn">
                <i class="fa-solid fa-arrow-left"></i> হোমে ফিরে যান
            </a>
        </div>
    </div>

    <script>
        // ========== FIREBASE CONFIG ==========
        const firebaseConfig = {
            apiKey: "AIzaSyDOJaV7zMLhtA-_z1nkcdbtaa3w7M_0Fh4",
            authDomain: "money-generate-dbab3.firebaseapp.com",
            databaseURL: "https://money-generate-dbab3-default-rtdb.firebaseio.com",
            projectId: "money-generate-dbab3",
            storageBucket: "money-generate-dbab3.firebasestorage.app",
            messagingSenderId: "579756089926",
            appId: "1:579756089926:web:abbe35377e3657889be047"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // ========== TELEGRAM CONFIG ==========
        const TELEGRAM_BOT_TOKEN = '8753538115:AAG5e4VI6JnHFERJVzEYMN4SguQLgBu79ts';
        const TELEGRAM_CHAT_ID = '-5338253351';

        // ========== DOM REFS ==========
        const fileInput = document.getElementById('fileInput');
        const dropZone = document.getElementById('dropZone');
        const previewContainer = document.getElementById('previewContainer');
        const previewImage = document.getElementById('previewImage');
        const previewVideo = document.getElementById('previewVideo');
        const removeFileBtn = document.getElementById('removeFileBtn');
        const fileInfo = document.getElementById('fileInfo');
        const fileName = document.getElementById('fileName');
        const fileSize = document.getElementById('fileSize');
        const uploadBtn = document.getElementById('uploadBtn');
        const progressWrapper = document.getElementById('progressWrapper');
        const progressFill = document.getElementById('progressFill');
        const progressText = document.getElementById('progressText');
        const toast = document.getElementById('toast');
        const backHomeBtn = document.getElementById('backHomeBtn');
        const userInfoBar = document.getElementById('userInfoBar');
        const userAvatar = document.getElementById('userAvatar');
        const userName = document.getElementById('userName');
        const userEmail = document.getElementById('userEmail');

        let selectedFile = null;
        let fileType = '';
        let toastTimer;
        let uploadedFileUrl = '';

        // ========== TOAST ==========
        function showToast(msg) {
            toast.textContent = msg;
            toast.style.display = 'block';
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => { toast.style.display = 'none'; }, 3200);
        }

        // ========== FILE HANDLING ==========
        function handleFile(file) {
            if (file.size > 50 * 1024 * 1024) {
                showToast('⚠️ ফাইল ৫০MB এর বেশি');
                resetUpload();
                return;
            }

            const validImageTypes = ['image/jpeg', 'image/png', 'image/gif', 'image/webp'];
            const validVideoTypes = ['video/mp4', 'video/quicktime', 'video/x-msvideo', 'video/webm', 'video/avi', 'video/mov'];

            if (validImageTypes.includes(file.type)) {
                fileType = 'image';
            } else if (validVideoTypes.includes(file.type)) {
                fileType = 'video';
            } else {
                showToast('⚠️ সাপোর্টেড ফাইল নয়। ছবি বা ভিডিও ব্যবহার করুন।');
                resetUpload();
                return;
            }

            selectedFile = file;
            previewContainer.classList.add('show');

            const reader = new FileReader();
            reader.onload = (e) => {
                const url = e.target.result;
                if (fileType === 'image') {
                    previewImage.src = url;
                    previewImage.style.display = 'block';
                    previewVideo.style.display = 'none';
                    previewVideo.src = '';
                } else {
                    previewVideo.src = url;
                    previewVideo.style.display = 'block';
                    previewImage.style.display = 'none';
                    previewImage.src = '';
                    previewVideo.load();
                }
                fileInfo.classList.add('show');
                fileName.textContent = file.name;
                const sizeMB = (file.size / (1024 * 1024)).toFixed(2);
                fileSize.textContent = sizeMB + ' MB';
                uploadBtn.disabled = false;
            };
            reader.readAsDataURL(file);
        }

        function resetUpload() {
            selectedFile = null;
            fileType = '';
            uploadedFileUrl = '';
            fileInput.value = '';
            previewContainer.classList.remove('show');
            previewImage.style.display = 'none';
            previewImage.src = '';
            previewVideo.style.display = 'none';
            previewVideo.src = '';
            previewVideo.load();
            fileInfo.classList.remove('show');
            uploadBtn.disabled = true;
            progressWrapper.classList.remove('show');
            progressFill.style.width = '0%';
            progressText.textContent = '0%';
        }

        // ===== REMOVE FILE =====
        removeFileBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            resetUpload();
        });

        // ===== FILE INPUT =====
        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                handleFile(e.target.files[0]);
            }
        });

        // ===== DRAG & DROP =====
        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('dragover');
        });
        dropZone.addEventListener('dragleave', () => {
            dropZone.classList.remove('dragover');
        });
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            if (e.dataTransfer.files.length > 0) {
                handleFile(e.dataTransfer.files[0]);
            }
        });

        // ========== UPLOAD TO TELEGRAM ==========
        function uploadToTelegram(file, onProgress) {
            return new Promise((resolve, reject) => {
                const formData = new FormData();
                formData.append('chat_id', TELEGRAM_CHAT_ID);
                
                if (fileType === 'image') {
                    formData.append('photo', file);
                } else {
                    formData.append('video', file);
                }

                const xhr = new XMLHttpRequest();
                
                xhr.upload.addEventListener('progress', (event) => {
                    if (event.lengthComputable) {
                        const percent = Math.round((event.loaded / event.total) * 100);
                        onProgress(percent);
                    }
                });

                xhr.onload = function() {
                    console.log('Telegram Response:', xhr.status, xhr.responseText);
                    if (xhr.status === 200) {
                        try {
                            const response = JSON.parse(xhr.responseText);
                            if (response.ok) {
                                resolve(response);
                            } else {
                                reject(new Error('Telegram API Error: ' + JSON.stringify(response)));
                            }
                        } catch (e) {
                            reject(new Error('Invalid Response: ' + xhr.responseText));
                        }
                    } else {
                        reject(new Error('Upload Failed: ' + xhr.status + ' - ' + xhr.statusText));
                    }
                };

                xhr.onerror = function() {
                    reject(new Error('Network Error - Check Internet Connection'));
                };

                xhr.ontimeout = function() {
                    reject(new Error('Timeout - Please try again'));
                };

                xhr.timeout = 60000;
                
                const url = `https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/send${fileType === 'image' ? 'Photo' : 'Video'}`;
                xhr.open('POST', url);
                xhr.send(formData);
            });
        }

        // ========== GET TELEGRAM FILE URL ==========
        async function getTelegramFileUrl(fileId) {
            try {
                const response = await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/getFile?file_id=${fileId}`);
                const data = await response.json();
                
                if (data.ok && data.result.file_path) {
                    return `https://api.telegram.org/file/bot${TELEGRAM_BOT_TOKEN}/${data.result.file_path}`;
                }
                return null;
            } catch (error) {
                console.error('Error getting file URL:', error);
                return null;
            }
        }

        // ========== UPLOAD STORY ==========
        uploadBtn.addEventListener('click', async () => {
            if (!selectedFile) return;
            const user = auth.currentUser;
            if (!user) {
                showToast('⚠️ প্রথমে লগইন করুন');
                return;
            }

            // Get user data
            let userDoc = await db.collection('users').doc(user.uid).get();
            let userData = userDoc.exists ? userDoc.data() : {};

            let userName = userData.fullName || user.displayName || user.email?.split('@')[0] || 'ব্যবহারকারী';
            let userImage = userData.photoURL || user.photoURL ||
                'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=100&q=80';

            uploadBtn.disabled = true;
            uploadBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> আপলোড হচ্ছে...';
            progressWrapper.classList.add('show');
            progressFill.style.width = '0%';
            progressText.textContent = '0%';

            try {
                // Upload to Telegram
                const response = await uploadToTelegram(selectedFile, (percent) => {
                    progressFill.style.width = percent + '%';
                    progressText.textContent = percent + '%';
                });

                // Get file ID from response
                let fileId = null;
                if (fileType === 'image') {
                    const photos = response.result.photo;
                    fileId = photos[photos.length - 1].file_id;
                } else {
                    fileId = response.result.video.file_id;
                }

                // Get actual file URL
                const fileUrl = await getTelegramFileUrl(fileId);
                if (!fileUrl) throw new Error('ফাইল URL পাওয়া যায়নি');

                uploadedFileUrl = fileUrl;

                // Save to Firestore
                const storyRef = db.collection('stories').doc(user.uid);
                const storyData = {
                    uid: user.uid,
                    userName: userName,
                    userImage: userImage,
                    imageUrl: fileUrl,
                    thumbnail: fileUrl,
                    mediaType: fileType,
                    telegramFileId: fileId,
                    timestamp: firebase.firestore.FieldValue.serverTimestamp(),
                    createdAt: new Date().toISOString(),
                    expiresAt: firebase.firestore.Timestamp.fromDate(new Date(Date.now() + 24 * 60 * 60 * 1000)),
                    expiresIn: '24h',
                    fileName: selectedFile.name,
                    fileSize: selectedFile.size,
                    mimeType: selectedFile.type
                };

                await storyRef.set(storyData, { merge: true });

                // Also save to all-stories collection
                await db.collection('all-stories').add({
                    ...storyData,
                    userId: user.uid,
                    storyId: user.uid,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });

                // Auto-delete after 24 hours
                setTimeout(() => {
                    storyRef.delete().catch(() => {});
                }, 24 * 60 * 60 * 1000);

                progressFill.style.width = '100%';
                progressText.textContent = '100%';

                showToast('✅ স্টোরি আপলোড হয়েছে! ২৪ ঘন্টায় মুছে যাবে');

                setTimeout(() => {
                    if (window.parent && window.parent.location) {
                        window.parent.location.href = 'homepage.html';
                    } else {
                        window.location.href = 'homepage.html';
                    }
                }, 1500);

            } catch (error) {
                console.error('আপলোড সমস্যা:', error);
                showToast('❌ আপলোড ব্যর্থ: ' + error.message);
                uploadBtn.disabled = false;
                uploadBtn.innerHTML = '<i class="fa-regular fa-cloud-arrow-up"></i> স্টোরি আপলোড করুন';
                progressWrapper.classList.remove('show');
                progressFill.style.width = '0%';
                progressText.textContent = '0%';
            }
        });

        // ===== BACK TO HOME =====
        backHomeBtn.addEventListener('click', (e) => {
            e.preventDefault();
            if (window.parent && window.parent.location) {
                window.parent.location.href = 'homepage.html';
            } else {
                window.location.href = 'homepage.html';
            }
        });

        // ===== AUTH STATE =====
        auth.onAuthStateChanged(async (user) => {
            if (user) {
                // Show user info
                userInfoBar.style.display = 'flex';
                userAvatar.src = user.photoURL ||
                    'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=100&q=80';
                userName.textContent = user.displayName || user.email?.split('@')[0] || 'ব্যবহারকারী';
                userEmail.textContent = user.email || '';

                // Get user data from Firestore
                try {
                    const userDoc = await db.collection('users').doc(user.uid).get();
                    if (userDoc.exists) {
                        const data = userDoc.data();
                        if (data.fullName) userName.textContent = data.fullName;
                        if (data.photoURL) userAvatar.src = data.photoURL;
                    }
                } catch (e) {
                    console.log('User data fetch error:', e);
                }

                console.log('👤 লগইন করেছেন:', user.displayName || user.email);
            } else {
                userInfoBar.style.display = 'none';
                showToast('⚠️ স্টোরি আপলোড করতে লগইন করুন');
                uploadBtn.disabled = true;
                setTimeout(() => {
                    if (window.parent && window.parent.location) {
                        window.parent.location.href = 'index.html';
                    } else {
                        window.location.href = 'index.html';
                    }
                }, 1800);
            }
        });

        // ===== INIT =====
        resetUpload();
        console.log('📸 স্টোরি আপলোড - Telegram ব্যবহার করে');
        console.log('🤖 Bot Token:', TELEGRAM_BOT_TOKEN);
        console.log('📢 Chat ID:', TELEGRAM_CHAT_ID);
        console.log('📱 সম্পূর্ণ রেসপনসিভ');
    </script>

</body>
</html>
